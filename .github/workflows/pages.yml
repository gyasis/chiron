name: Deploy Chiron Player to Pages

# Publishes skill/player/ (the installable PWA) to GitHub Pages.
# Served at https://gyasis.github.io/chiron/

on:
  push:
    branches: [main]
    paths:
      - 'skill/player/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skill/player
      - id: deployment
        uses: actions/deploy-pages@v4
