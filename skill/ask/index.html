<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Chiron · Ask</title>
<meta name="theme-color" content="#1e3a5f">
<script>try{var _t=localStorage.getItem('chiron.theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}
/* ?inapp=1 = embedded in the phone app's Chiedi overlay: the app owns navigation + theme, and Android WebView has no Web Speech input */
try{var _q=new URLSearchParams(location.search);if(_q.get('inapp')==='1'){document.documentElement.setAttribute('data-inapp','');var _th=_q.get('theme');if(_th)document.documentElement.setAttribute('data-theme',_th);}}catch(e){}</script>
<script src="./say-shim.js"></script><!-- no Web Speech output in Android WebView: 🔊 → Lucrezia via /api/oral/say -->
<link rel="stylesheet" href="./skin.css">
<style>
:root{
  --chiron-bg:#faf8f5;--chiron-surface:#fff;--chiron-elevated:#f0ebe4;
  --chiron-fg:#1a1a1a;--chiron-fg-secondary:#4a4a4a;--chiron-muted:#7a7a7a;
  --chiron-accent:#1e3a5f;--chiron-border:#e5e0d8;--chiron-divider:#ede8df;
  --med:#1e6fbf;--medit:#b3522e;--lang:#6b8e4e;--vid:#8a5a83;--code:#6d28d9;
  --medbg:#eef4fb;--meditbg:#f3e9d8;--langbg:#eef3e6;--vidbg:#f3ecf2;--codebg:#efeafe;
  --font-h:'Inter',system-ui,sans-serif;--font-b:'Source Sans 3','Inter',system-ui,sans-serif;
}
[data-theme="dark"]{
  --chiron-bg:#14171c;--chiron-surface:#1b1f26;--chiron-elevated:#232830;
  --chiron-fg:#e9e6e1;--chiron-fg-secondary:#bdb8b1;--chiron-muted:#8b8781;
  --chiron-accent:#7fb0e8;--chiron-border:#2c323b;--chiron-divider:#242931;
  --medbg:#16252f;--meditbg:#2b211a;--langbg:#1b2418;--vidbg:#241b23;--codebg:#221c33;
}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0}
body{font-family:var(--font-b);background:var(--chiron-bg);color:var(--chiron-fg);display:flex;overflow:hidden}
button{font:inherit;cursor:pointer}

/* ── left rail (Chiron chrome; acolyte owns everything right of it) ── */
.rail{flex:0 0 258px;background:var(--chiron-surface);border-right:1px solid var(--chiron-border);display:flex;flex-direction:column;min-height:0}
.rail .brand{text-decoration:none;display:flex;align-items:center;gap:9px;font-family:var(--font-h);font-weight:800;color:var(--chiron-accent);font-size:15px;padding:15px 16px 12px}
.rail .brand:hover{background:var(--chiron-elevated)}
.rail .brand .mk{width:28px;height:28px;border-radius:8px;background:var(--chiron-accent);color:var(--chiron-surface);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.newchat{margin:0 12px 12px;padding:9px 12px;border:1px solid var(--chiron-border);background:var(--chiron-bg);color:var(--chiron-fg);border-radius:10px;font-size:13.5px;font-weight:600;width:calc(100% - 24px);text-align:left}
.newchat:hover{border-color:var(--chiron-accent);color:var(--chiron-accent)}
.scope{margin:0 12px 14px;padding:10px 11px;background:var(--chiron-bg);border:1px solid var(--chiron-border);border-radius:10px}
.scope .lbl{font-family:var(--font-h);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--chiron-muted);margin-bottom:7px}
.scope select{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--chiron-border);border-radius:8px;background:var(--chiron-surface);color:var(--chiron-fg)}
.scope .hint{font-size:11.5px;color:var(--chiron-muted);margin-top:7px;line-height:1.4}
.rail h4{font-family:var(--font-h);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--chiron-muted);margin:6px 16px 5px;font-weight:700}
.threads{flex:1;overflow:auto;padding-bottom:10px}
.throw{display:flex;align-items:center;margin:1px 8px;border-radius:8px}
.throw:hover{background:var(--chiron-elevated)}
.throw.on{background:var(--chiron-elevated)}
.throw.on .th{color:var(--chiron-fg);font-weight:600}
.th{flex:1;min-width:0;display:block;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;color:var(--chiron-fg-secondary);font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thx{flex:0 0 auto;border:0;background:none;color:var(--chiron-muted);font-size:15px;line-height:1;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .12s}
.throw:hover .thx{opacity:1}
.thx:hover{color:#b3522e;background:var(--chiron-bg)}
.thempty{padding:6px 16px;font-size:12px;color:var(--chiron-muted);line-height:1.5}
.th:hover{background:var(--chiron-elevated)}
.th.on{background:var(--chiron-elevated);color:var(--chiron-fg);font-weight:600}
.th .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle}
.d-medicine{background:var(--med)}.d-medical-italian{background:var(--medit)}
.d-language-it{background:var(--lang)}.d-video-it{background:var(--vid)}.d-all{background:var(--chiron-muted)}
.threads h4{margin-top:12px}
.railfoot{border-top:1px solid var(--chiron-border);padding:9px 12px;display:flex;align-items:center;gap:2px;
          font-size:12px;color:var(--chiron-muted);flex-wrap:nowrap;white-space:nowrap}
.railfoot button{border:0;background:none;color:var(--chiron-muted);padding:4px 6px;border-radius:6px}
.railfoot button:hover{background:var(--chiron-elevated);color:var(--chiron-fg)}
.railfoot .sp{margin-left:auto;font-size:11px}

/* Acolyte is mounted with ui.layout:'inline' + ui.theme (see ask.js), so it
   needs no positioning or colour overrides here. The pilot's message shapes,
   avatar, citation chips and composer live in skin.css. */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;
        border-bottom:1px solid var(--chiron-border);background:var(--chiron-bg)}
.topbar .tt{min-width:0}
/* the "N running" pill (running.js): every job the server is working on, with its elapsed time */
.chiron-running{position:relative}
.chiron-running-pill{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--chiron-border);background:var(--chiron-elevated);color:var(--chiron-fg);cursor:pointer;white-space:nowrap}
.chiron-running-list{position:absolute;right:0;top:calc(100% + 6px);z-index:50;width:min(360px,90vw);max-height:60vh;overflow:auto;padding:6px;border-radius:12px;border:1px solid var(--chiron-border);background:var(--chiron-bg);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.chiron-running-row{display:block;padding:8px 10px;border-radius:8px;color:var(--chiron-fg);text-decoration:none}
.chiron-running-row:hover{background:var(--chiron-elevated)}
.chiron-running-row .crr-t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chiron-running-row .crr-d{font-size:12px;color:var(--chiron-muted)}
.ttl{font-family:var(--font-h);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
/* nowrap+ellipsis like .ttl above: the topbar is a FIXED 52px, so any element
   added to the row (the focus chip) squeezes .tt and a wrapping subtitle spills
   out of the bar instead of truncating. */
.tsub{font-size:12px;color:var(--chiron-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.tools{margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.chip{border:1px solid var(--chiron-border);background:var(--chiron-surface);color:var(--chiron-fg-secondary);
      border-radius:99px;padding:5px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip:hover:not(:disabled){border-color:var(--chiron-accent);color:var(--chiron-accent)}
.chip.on{background:var(--chiron-accent);border-color:var(--chiron-accent);color:var(--chiron-surface)}
.chip:disabled{opacity:.45;cursor:default}
/* The focus chip states an ACTIVE CONSTRAINT on retrieval, so it reuses .chip.on
   (accent-filled) rather than introducing a second pill vocabulary, and sits in
   the topbar row — stacking it under .tsub would overflow the fixed 52px. */
.chip.focus-chip{cursor:pointer;flex:0 0 auto;max-width:34vw}
.chip.focus-chip .af-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.focus-chip .af-x{opacity:.7;font-size:11px;margin-left:1px}
.chip.focus-chip:hover .af-x{opacity:1}
#host{flex:1;display:flex;min-width:0;min-height:0}

/* the composer's meta strip — model, persona, and what is actually indexed */
.cmeta{flex:0 0 auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
       width:100%;max-width:880px;margin:-8px auto 16px;padding:0 22px;
       font-size:11.5px;color:var(--chiron-muted)}
.cmeta select{font:inherit;font-size:11.5px;border:1px solid var(--chiron-border);border-radius:99px;
              padding:3px 9px;background:var(--chiron-surface);color:var(--chiron-fg-secondary);max-width:200px}
.cmeta .grounded{margin-left:auto;white-space:nowrap;order:1}
/* the settings group and the dock pieces: flat in the meta row on a wide screen, a sheet and a dock on a phone */
.cm-set,.cm-row{display:contents}
.cm-set-h,.cm-lbl,.dock-turn,.dock-basket,.setbtn{display:none}
.railfoot-link{color:var(--chiron-muted);text-decoration:none;padding:4px 6px;border-radius:6px;font-size:12px}
.railfoot-link:hover{background:var(--chiron-elevated);color:var(--chiron-fg)}
.boot{flex:1;display:grid;place-items:center;color:var(--chiron-muted);font-size:14px}
.boot .err{max-width:520px;text-align:center;line-height:1.6}
.boot code{background:var(--chiron-elevated);padding:2px 6px;border-radius:5px;font-size:12.5px}
/* PHONE (<=768px): the 258px rail becomes a slide-in drawer (☰ in the topbar), chat takes the full width.
   100dvh + interactive-widget=resizes-content (above) keep the composer above the soft keyboard. */
.menubtn,.scrim{display:none}
@media(max-width:768px){
  body{overflow:hidden}
  .rail{position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(84vw,300px);flex:none;transform:translateX(-103%);transition:transform .26s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top)}
  body.rail-open .rail{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.25)}
  .railfoot{flex-wrap:wrap}
  .scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
  body.rail-open .scrim{opacity:1;pointer-events:auto}
  .menubtn{display:grid;place-items:center;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--chiron-fg);font-size:19px}
  .main{width:100%}
  /* app bar: menu, a two-line title, then round icon buttons; the title is also the way into the settings sheet */
  .topbar{padding:0 6px 0 4px;gap:4px;padding-top:env(safe-area-inset-top);height:calc(54px + env(safe-area-inset-top))}
  .ttl,.tsub{max-width:none}
  .ttl{font-size:15.5px}
  .topbar .tt{flex:1;min-width:0;padding:0 2px;cursor:pointer}
  .topbar .tools{flex:0 0 auto;display:flex;gap:2px}
  #openlesson{display:none}
  /* the basket count lives in the practice dock on a phone */
  #basketbtn{display:none}
  #voicebtn,.setbtn{font-size:0;width:40px;height:40px;padding:0;justify-content:center;border:0;border-radius:50%;background:none;color:var(--chiron-fg)}
  #voicebtn.on{background:none;color:var(--chiron-fg)}
  #voicebtn::before{content:'🔊';font-size:16px}
  #voicebtn:not(.on)::before{opacity:.4}
  .setbtn{display:inline-flex}
  .setbtn::before{content:'⚙';font-size:18px;color:var(--chiron-fg-secondary)}
  #voicebtn:hover:not(:disabled),.setbtn:hover:not(:disabled){background:var(--chiron-elevated);color:var(--chiron-fg)}

  /* practice dock: Your turn for the latest reply, Pimsleur live and the basket, just above the composer */
  .cmeta{width:auto;max-width:none;margin:0 12px 8px;padding:8px 10px;gap:8px;font-size:13px;
         background:var(--chiron-surface);border:1px solid var(--chiron-border);border-radius:18px}
  .dock-turn:not([hidden]){display:flex;align-items:center;gap:8px;flex:1 1 100%;min-width:0}
  .dock-lbl{flex:0 0 auto;font:700 10.5px var(--font-h);letter-spacing:.08em;text-transform:uppercase;color:var(--lang)}
  .dock-q{flex:1;min-width:0;border:0;background:none;padding:3px 0;text-align:left;font-size:13.5px;font-weight:600;
          color:var(--chiron-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmeta .live-pill{min-height:36px;padding:0 14px;font-size:13.5px;border-color:transparent;background:var(--chiron-accent);color:var(--chiron-surface)}
  .cmeta .live-pill:hover:not(:disabled){background:var(--chiron-accent);color:var(--chiron-surface)}
  .dock-basket{display:inline-flex;min-height:36px;padding:0 13px;font-size:13.5px;font-weight:600;border-color:transparent;background:var(--chiron-elevated);color:var(--chiron-fg)}
  .dock-basket:hover:not(:disabled){border-color:transparent;color:var(--chiron-fg)}
  .dock-basket b{font-family:var(--font-h)}

  /* settings sheet: model, who answers and the grounding line, off the always-visible bottom area */
  .cm-set{display:flex;flex-direction:column;gap:14px;position:fixed;left:0;right:0;bottom:0;z-index:35;
          background:var(--chiron-surface);color:var(--chiron-fg);border-radius:20px 20px 0 0;font-size:14px;
          padding:12px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18);
          transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s}
  body.set-open .cm-set{transform:none;visibility:visible}
  body.set-open .scrim{opacity:1;pointer-events:auto}
  .cm-set-h{display:flex;align-items:center;gap:8px}
  .cm-set-h strong{font:700 16px var(--font-h)}
  .cm-x{margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--chiron-muted);font-size:15px}
  .cm-row{display:flex;flex-direction:column;gap:6px}
  .cm-lbl{display:block;font:700 10.5px var(--font-h);letter-spacing:.08em;text-transform:uppercase;color:var(--chiron-muted)}
  .cmeta .cm-set select{width:100%;max-width:none;min-height:44px;font-size:15px;padding:8px 12px;border-radius:12px;background:var(--chiron-bg)}
  .cmeta .cm-set .grounded{margin:0;white-space:normal;font-size:13px;color:var(--chiron-muted)}
}
/* in-app: the app's ‹ closes Ask, so the web-library links would only strand you in a nested library; the mic can't work in a WebView */
[data-inapp] .railfoot-link,[data-inapp] .acolyte-mic{display:none!important}
[data-inapp] .brand{pointer-events:none}
</style></head>
<body>

<div class="scrim" id="scrim"></div>
<aside class="rail">
  <a class="brand" href="/library/" title="Back to the library"><div class="mk">◈</div> Chiron · Ask</a>
  <button class="newchat" onclick="chironAsk.newThread()">＋ New question</button>

  <div class="scope">
    <div class="lbl">Ask across</div>
    <select id="scope"></select>
    <div class="hint" id="scopehint">Loading the corpus…</div>
  </div>

  <h4>Recent</h4>
  <div class="threads" id="threads"></div>

  <div class="railfoot">
    <button onclick="chironAsk.theme()">◐ Theme</button>
    <span id="settingsslot"></span>
    <a class="railfoot-link" href="/library/">📚 Library</a>
    <a class="railfoot-link" href="/library/?generate=1">✦ Generate</a>
    <span class="sp" id="ver"></span>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="menubtn" id="menubtn" aria-label="Conversations">☰</button>
    <div class="tt">
      <div class="ttl" id="ttl">New question</div>
      <div class="tsub" id="tsub">Scope: everything · grounded in your library</div>
    </div>
    <div class="tools">
      <button class="chip" id="basketbtn" hidden aria-expanded="false" aria-controls="basketpanel" title="Phrases collected for a Pimsleur lesson">🎧 Basket 0/8</button>
      <button class="chip on" id="voicebtn" title="Read answers aloud">🔊 Voice out</button>
      <button class="chip setbtn" id="setbtn" type="button" aria-label="Ask settings" aria-controls="cmset" aria-expanded="false">⚙</button>
      <button class="chip" id="openlesson" disabled title="Opens the top cited lesson">⤴ Open in lesson</button>
    </div>
  </div>

  <div id="host"><div class="boot" id="boot">Starting Chiron · Ask…</div></div>

  <div class="cmeta" id="cmeta">
    <div class="dock-turn" id="dockturn" hidden><span class="dock-lbl">Your turn</span><button class="dock-q" id="dockq" type="button" title="Answer it in the box below"></button></div>
    <div class="cm-set" id="cmset" role="dialog" aria-label="Ask settings">
      <div class="cm-set-h"><strong>Ask settings</strong><button class="cm-x" id="cmsetx" type="button" aria-label="Close settings">✕</button></div>
      <div class="cm-row" id="cmmodel"><span class="cm-lbl">Model</span></div>
      <div class="cm-row" id="cmpersona"><span class="cm-lbl">Who answers</span></div>
      <span class="grounded" id="grounded"></span>
    </div>
    <button class="chip live-pill" id="livebtn" type="button" title="Drill the phrases aloud, Pimsleur style">🎧 Pimsleur live<span id="liven"></span></button>
    <button class="chip dock-basket" id="dockbasket" type="button" aria-controls="basketpanel" title="Phrases collected for a Pimsleur lesson">Basket <b id="dockn">0</b></button>
    <span id="livenote" role="status"></span>
  </div>
</main>

<div id="basketpanel" class="bk-panel" role="dialog" aria-label="Pimsleur basket" hidden></div>

<script>
/* phone drawer: ☰ opens the rail, scrim / a thread / New question closes it */
(function () {
  var b = document.body, close = function () { b.classList.remove('rail-open'); };
  document.getElementById('menubtn').onclick = function () { b.classList.toggle('rail-open'); };
  document.getElementById('scrim').onclick = function () { close(); setSheet(false); };
  /* phone settings sheet: ⚙ or a tap on the title opens it, ✕ / the scrim closes it */
  var setBtn = document.getElementById('setbtn');
  var setSheet = function (on) { b.classList.toggle('set-open', on); setBtn.setAttribute('aria-expanded', String(on)); };
  setBtn.onclick = function () { setSheet(!b.classList.contains('set-open')); };
  document.getElementById('cmsetx').onclick = function () { setSheet(false); };
  document.querySelector('.topbar .tt').addEventListener('click', function () { if (matchMedia('(max-width:768px)').matches) setSheet(true); });
  document.querySelector('.rail').addEventListener('click', function (e) { if (e.target.closest('.th, .newchat')) close(); });
})();
</script>
<script type="module" src="./nib/nib.js"></script>
<script type="module" src="./ask.js"></script>
</body></html>
