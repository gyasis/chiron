<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chiron · Parole → frasi</title>
<meta name="theme-color" content="#1e3a5f">
<script>try{var _t=localStorage.getItem('chiron.theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<script src="/shell/inapp-boot.js"></script>
<style>
:root{
  --chiron-bg:#faf8f5;--chiron-surface:#fff;--chiron-elevated:#f0ebe4;
  --chiron-fg:#1a1a1a;--chiron-fg-secondary:#4a4a4a;--chiron-muted:#7a7a7a;
  --chiron-accent:#1e3a5f;--chiron-border:#e5e0d8;--chiron-divider:#ede8df;
  --med:#1e6fbf;--medit:#b3522e;--lang:#6b8e4e;--vid:#8a5a83;
  --medbg:#eef4fb;--meditbg:#f3e9d8;--langbg:#eef3e6;--vidbg:#f3ecf2;
  --ok:#2e7d32;--bad:#a33;--badbg:#fbeaea;--amber:#a86200;
  --font-h:'Inter',system-ui,sans-serif;--font-b:'Inter',system-ui,sans-serif;
}
[data-theme="dark"]{
  --chiron-bg:#14171c;--chiron-surface:#1b1f26;--chiron-elevated:#232830;
  --chiron-fg:#e9e6e1;--chiron-fg-secondary:#bdb8b1;--chiron-muted:#8b8781;
  --chiron-accent:#7fb0e8;--chiron-border:#2c323b;--chiron-divider:#242931;
  --medbg:#16252f;--meditbg:#2b211a;--langbg:#1b2418;--vidbg:#241b23;
  --ok:#7fc784;--bad:#e58a8a;--badbg:#2e1b1b;--amber:#e3a94a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-b);background:var(--chiron-bg);color:var(--chiron-fg);font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
header .mk{width:28px;height:28px;border-radius:8px;background:var(--chiron-accent);color:var(--chiron-surface);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
header h1{font:800 16px var(--font-h);color:var(--chiron-accent);margin:0}
header small{color:var(--chiron-muted)}
#theme{margin-left:auto;border:1px solid var(--chiron-border);background:var(--chiron-surface);border-radius:8px;padding:5px 9px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--chiron-border);margin-bottom:14px;overflow-x:auto}
nav button{border:0;background:none;padding:9px 11px;font-weight:600;color:var(--chiron-muted);white-space:nowrap;border-radius:8px 8px 0 0}
nav button small{display:block;font-weight:400;font-size:10.5px}
nav button.on{background:var(--chiron-surface);color:var(--chiron-accent);box-shadow:inset 0 -1px 0 var(--chiron-accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--chiron-surface);border:1px solid var(--chiron-border);border-radius:12px;padding:14px;margin-bottom:12px}
label.l{display:block;font:700 10.5px var(--font-h);letter-spacing:.08em;text-transform:uppercase;color:var(--chiron-muted);margin:0 0 5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.grow{flex:1 1 160px}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--chiron-border);border-radius:9px;background:var(--chiron-bg)}
textarea{min-height:110px;resize:vertical}
.btn{border:1px solid var(--chiron-border);background:var(--chiron-surface);border-radius:9px;padding:9px 13px;font-weight:600}
.btn:hover{border-color:var(--chiron-accent);color:var(--chiron-accent)}
.btn.pri{background:var(--chiron-accent);border-color:var(--chiron-accent);color:var(--chiron-surface)}
.btn.pri:hover{color:var(--chiron-surface);opacity:.9}
.btn:disabled{opacity:.5;cursor:default}
.hint{color:var(--chiron-muted);font-size:12px}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;background:var(--chiron-elevated);font-size:12.5px;margin:2px 3px 2px 0}
.chip.deck{background:var(--medbg);color:var(--med);font-weight:600;font-size:11px}
.chip.v{background:var(--vidbg);color:var(--vid);font-weight:600}
.err{background:var(--badbg);color:var(--bad);border:1px solid var(--chiron-border);border-radius:9px;padding:9px 12px;margin:10px 0;font-weight:600}
.ok{color:var(--ok);font-weight:600}
.spin{display:flex;align-items:center;gap:9px;color:var(--chiron-muted);padding:10px 0}
.spin i{width:16px;height:16px;border:2px solid var(--chiron-border);border-top-color:var(--chiron-accent);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.res-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.res{display:flex;gap:10px;padding:10px 4px;border-top:1px solid var(--chiron-divider)}
.res input{margin-top:4px;flex:none;width:18px;height:18px}
.res .t{min-width:0;flex:1}
.res .f{font-weight:600;overflow-wrap:anywhere}
.res .b{color:var(--chiron-fg-secondary);font-size:13.5px;overflow-wrap:anywhere}
.corr{border-top:1px solid var(--chiron-divider);padding:9px 0}
.corr .it{font-weight:600}.corr .en{color:var(--chiron-fg-secondary)}.corr .nt{font-size:12.5px;color:var(--chiron-muted)}
.chat{display:grid;gap:8px;margin-bottom:10px}
.msg{padding:9px 12px;border-radius:12px;max-width:90%;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{justify-self:end;background:var(--chiron-accent);color:var(--chiron-surface)}
.msg.bot{justify-self:start;background:var(--chiron-elevated)}
/* drill */
#drill{display:none}
#drill.on{display:block}
.dh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dh b{font:700 12.5px var(--font-h)}
.dh .x{margin-left:auto;border:0;background:none;font-size:16px;color:var(--chiron-muted)}
.bar{height:3px;background:var(--chiron-divider);border-radius:2px;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--chiron-accent);transition:width .25s}
.face{text-align:center;display:grid;gap:12px;padding:18px 6px}
.face .big{font:600 22px/1.35 var(--font-h);overflow-wrap:anywhere}
.face .sit{font:600 21px/1.35 var(--font-h)}
.face .sec{color:var(--chiron-fg-secondary);font-size:16px}
.face .note{font-size:12.5px;color:var(--chiron-muted)}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bank .chip{background:var(--langbg);color:var(--lang);font-weight:600;font-size:14px}
.verbs .chip{font-size:14px}
.ear{font-size:44px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}
.grades button{border:1px solid var(--chiron-border);background:var(--chiron-surface);border-radius:9px;padding:9px 2px;font-weight:700}
.grades button small{display:block;font-weight:400;font-size:10px;color:var(--chiron-muted)}
.grades button:hover{border-color:var(--chiron-accent)}
.wstate{font-size:12px;text-align:center;min-height:18px;color:var(--chiron-muted)}
.hide{display:none!important}
.tally{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--chiron-border);border-radius:9px;overflow:hidden;background:var(--chiron-surface);max-width:100%}
.seg button{border:0;background:none;padding:9px 11px;font-weight:600;color:var(--chiron-muted);white-space:nowrap}
.seg button.on{background:var(--chiron-accent);color:var(--chiron-surface)}
.dict{display:grid;gap:12px;text-align:left}
.dict textarea{min-height:96px;font-size:16px}
.dict .acts{justify-content:flex-start}
.btn.tog[aria-pressed=true]{background:var(--chiron-elevated);color:var(--chiron-accent);border-color:var(--chiron-accent)}
.diff{font:600 19px/2.1 var(--font-b);overflow-wrap:anywhere}
.dw{display:inline-block;vertical-align:bottom;text-align:center;margin:0 1px;line-height:1.25;padding-top:2px}
.dw s{display:block;font-size:12.5px;font-weight:500;color:var(--chiron-muted)}
.dw.ok{color:var(--ok)}
.dw.accent{color:var(--amber)}.dw.accent s{color:var(--amber)}
.dw.sub,.dw.del{color:var(--bad)}.dw.sub s{color:var(--bad)}
.dw.del b{font-weight:600;text-decoration:underline wavy;text-underline-offset:4px}
.dw.ins{color:var(--chiron-muted);text-decoration:line-through;font-weight:500}
.dw.j{margin-right:0}
.score{font:700 14px var(--font-h)}
.legend{margin-top:6px;font-size:11.5px;color:var(--chiron-muted)}
.legend .ok{font-weight:600}
.grades button.sug{background:var(--chiron-accent);color:var(--chiron-surface);border-color:var(--chiron-accent)}
.grades button.sug small{color:inherit;opacity:.8}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.miss .chip{background:var(--badbg);color:var(--bad);font-weight:600}
@media(max-width:480px){.face .big,.face .sit{font-size:19px}.btn{padding:9px 11px}}
#drill{display:block}
.setup .row{margin-bottom:8px}
.setup textarea{min-height:96px}
.front{display:grid;gap:22px;justify-items:center;padding:56px 0 40px}
.front .ear{font-size:64px;line-height:1}
.front .acts .btn{padding:14px 22px;font-size:17px}
.btn.big{padding:20px 36px;font-size:22px;min-width:220px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--chiron-accent);animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
.pair{display:grid;gap:2px}.pair .it{font:600 24px/1.3 var(--font-h);overflow-wrap:anywhere}.pair .en{color:var(--chiron-fg-secondary);font-size:16px}
.wordbox{background:var(--chiron-elevated);border-radius:12px;padding:10px 12px}
.wordbox .it{font-size:20px}
.src{font-size:11.5px;color:var(--chiron-muted)}
.grades button{padding:11px 2px;font-size:12.5px;line-height:1.2}
.grades button small{margin-top:3px}
.clip{width:100%;max-height:220px;border-radius:10px;background:#000}
.tog[aria-pressed=true]{background:var(--chiron-elevated);color:var(--chiron-accent);border-color:var(--chiron-accent)}
.wlist{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
</style>
</head><body><div class="wrap">
<header><div class="mk">A</div><h1>Parole → frasi <small>· ascolto</small></h1><a href="/sessione" class="hint" style="margin-left:10px">Sessione</a><button id="theme" title="Tema">◐</button></header>
<div id="banner"></div>
<div id="setup" class="card setup">
  <div class="row"><button class="btn pri" id="mm">Da Match Madness</button><span class="hint grow" id="mm-note">le parole che sbagli, in ordine di difficoltà</span></div>
  <label class="l" for="words">Parole · una per riga (opzionale: «parola | english»)</label>
  <textarea id="words" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ricetta&#10;paziente&#10;consenso"></textarea>
  <div class="row" style="margin-top:8px"><div><label class="l" for="cap">Frasi per parola</label><select id="cap"><option>3</option><option selected>5</option><option>8</option></select></div>
  <button class="btn pri" id="go">Raccogli frasi e ascolta</button></div>
  <div id="status"></div>
</div>
<div id="drill"></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const media=f=>'/cards/media/'+encodeURIComponent(f);
const QS=new URLSearchParams(location.search);
$('#theme').onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('chiron.theme',n)}catch(e){}};
async function api(path,body){
  const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:undefined);
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const m=(d&&(d.detail||d.error||d.message))||r.statusText;const e=new Error(typeof m==='string'?m:JSON.stringify(m));e.status=r.status;throw e;}
  return d;
}
const setBanner=m=>{$('#banner').innerHTML=m?`<div class="err">${esc(m)}</div>`:'';};
const GR=[['Non ho capito','again','1'],['A fatica','hard','2'],['Capito','good','3'],['Capito subito','easy','4']];
const PAUSE=600,LOOPGAP=1500;
let unlocked=false;   // set by the first tap or key: browsers refuse audio.play() before one
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>{unlocked=true;},true));
const Q={lessonMode:false,lesson:null,fetching:false,blocked:false,items:[],i:0,res:[],revealed:false,loading:false,waiting:false,tok:0,audio:null,timer:null,loop:true,cap:5};
try{Q.loop=localStorage.getItem('chiron.ascolto.loop')!=='0'}catch(e){}

// ---------- audio: word, pause, sentence (loops until revealed) ----------
function stopAudio(){Q.tok++;clearTimeout(Q.timer);if(Q.audio){Q.audio.onended=Q.audio.onerror=null;Q.audio.pause();Q.audio=null;}}
function playFile(f,tok){return new Promise(res=>{if(!f||tok!==Q.tok||Q.blocked)return res();const a=new Audio(media(f));Q.audio=a;a.onended=a.onerror=()=>res();
  a.play().catch(()=>{if(tok!==Q.tok)return res();Q.blocked=true;tapNeeded();res();});});}
// play() was refused: show a visible retry button. Never continue silently.
function tapNeeded(){const slot=$('#tapslot');if(!slot)return;
  slot.innerHTML='<button class="btn pri big" id="tap">🔊 Tocca per ascoltare</button>';
  $('#tap').onclick=()=>{Q.blocked=false;unlocked=true;slot.innerHTML='';if(Q.revealed)replay();else listen();};}
const wait=ms=>new Promise(r=>{Q.timer=setTimeout(r,ms);});
async function listen(){
  stopAudio();const tok=Q.tok,c=Q.items[Q.i];if(!c)return;
  do{
    await playFile(c.word.audio,tok);if(tok!==Q.tok||Q.blocked)return;
    await wait(PAUSE);if(tok!==Q.tok)return;
    await playFile(c.s.audio,tok);if(tok!==Q.tok||Q.blocked)return;
    if(!Q.loop||Q.revealed)return;
    await wait(LOOPGAP);
  }while(tok===Q.tok&&Q.loop&&!Q.revealed);
}
// ---------- drill ----------
function startDrill(){
  $('#setup').classList.add('hide');
  document.removeEventListener('keydown',keyH);document.addEventListener('keydown',keyH);
  renderCard();
}
function closeDrill(){stopAudio();$('#drill').innerHTML='';$('#setup').classList.remove('hide');document.removeEventListener('keydown',keyH);}
function keyH(e){
  if(!$('#drill').innerHTML||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===' '){e.preventDefault();replay();}
  else if(e.key==='Enter'){e.preventDefault();if(!Q.revealed)reveal();}
  else if('1234'.includes(e.key)&&Q.revealed)grade(+e.key-1);
}
function replay(){const c=Q.items[Q.i];if(!c)return;
  if(Q.revealed){stopAudio();const tok=Q.tok;playFile(c.word.audio,tok).then(()=>wait(PAUSE)).then(()=>playFile(c.s.audio,tok));}else listen();}
function renderCard(){
  stopAudio();Q.revealed=false;Q.waiting=false;Q.blocked=false;
  const n=Q.items.length;
  if(Q.i>=n){
    if(Q.loading){Q.waiting=true;$('#drill').innerHTML=`<div class="dh"><button class="x" id="dx">✕</button></div><div class="spin"><i></i><span>Preparo altre frasi…</span></div>`;$('#dx').onclick=()=>{closeDrill();summary(true)};return;}
    return summary(false);
  }
  // FRONT: audio only. No word, no sentence, no deck / template text -- just the controls.
  $('#drill').innerHTML=`<div class="dh">${Q.loading?'<span class="dot"></span>':''}<button class="x" id="dx" title="Chiudi">✕</button></div>
    <div class="bar"><i style="width:${Q.i/Math.max(n,1)*100}%"></i></div>
    <div class="front"><div class="ear" aria-hidden="true">🎧</div>
      <div id="tapslot">${unlocked?'':'<button class="btn pri big" id="start">▶ Inizia</button>'}</div>
      <div class="acts"><button class="btn" id="rp">🔁 Riascolta</button><button class="btn pri" id="rv">Mostra</button></div>
      <div class="acts"><button class="btn tog" id="lp" aria-pressed="${Q.loop}">↻ Ripeti in loop</button></div></div>
    <div class="hint" style="text-align:center">spazio = riascolta · invio = mostra</div>`;
  $('#dx').onclick=()=>{closeDrill();summary(true)};
  $('#rp').onclick=replay;$('#rv').onclick=reveal;
  $('#lp').onclick=e=>{Q.loop=!Q.loop;try{localStorage.setItem('chiron.ascolto.loop',Q.loop?'1':'0')}catch(x){}e.target.setAttribute('aria-pressed',Q.loop);if(Q.loop&&!Q.revealed)listen();};
  const st=$('#start');
  if(st)st.onclick=()=>{unlocked=true;st.remove();listen();};   // first audio only after a tap
  else listen();
}
function reveal(){
  if(Q.revealed)return;Q.revealed=true;stopAudio();
  const c=Q.items[Q.i],s=c.s,w=c.word,n=Q.items.length;
  const clip=s.clip?`<div class="acts"><button class="btn" id="clipb">▶ Guarda la scena</button></div><div id="clipv"></div>`:'';
  $('#drill').innerHTML=`<div class="dh"><b>${esc(w.it)}</b><span class="hint">frase ${c.k+1} di ${c.of}</span><button class="x" id="dx" title="Chiudi">✕</button></div>
    <div class="bar"><i style="width:${(Q.i+1)/n*100}%"></i></div>
    <div class="face">
      ${Q.lessonMode?'':`<div class="wordbox pair"><div class="it">${esc(w.it)}</div><div class="en">${esc(w.en||'')}</div></div>`}
      <div class="pair"><div class="it">${esc(s.it)}</div><div class="en">${esc(s.en)}</div></div>
      <div class="src">${esc(s.label||s.source)}${s.deck?' · '+esc(s.deck.replace(/^.*::/,'')):''}</div>
      <div class="acts"><button class="btn" id="rp">🔊 Riascolta</button>${Q.lessonMode?'':`<button class="btn" id="more">+ Altre frasi per «${esc(w.it)}»</button>`}</div>
      <div id="tapslot"></div>${clip}<div id="mst" class="hint"></div>
    </div>
    <div class="wstate" id="ws"></div>
    <div class="grades" id="gr">${GR.map(([t,,k])=>`<button data-g="${k}">${t}<small>${k}</small></button>`).join('')}</div>
    <div class="hint" style="text-align:center;margin-top:8px">valuta solo se hai CAPITO l'audio · 1-4</div>`;
  $('#dx').onclick=()=>{closeDrill();summary(true)};
  $('#rp').onclick=replay;if($('#more'))$('#more').onclick=()=>more(c);
  $$('#gr button').forEach((b,k)=>b.onclick=()=>grade(k));
  if(clip)$('#clipb').onclick=()=>{const sp='#t='+s.clip.start+','+s.clip.end;
    // hub (https :8943): same-origin /lessons/<slug>/ has Range support; plain :8910 has none and is mixed content on https
    const u=location.port==='8943'?'/lessons/'+encodeURIComponent(s.clip.slug)+'/episode.mp4'+sp:location.protocol+'//'+location.hostname+':8910/'+s.clip.path+sp;
    $('#clipv').innerHTML=`<video class="clip" src="${esc(u)}" controls playsinline autoplay></video>`;};
}
async function more(c){
  const b=$('#more');b.disabled=true;$('#mst').textContent='Cerco altre frasi… (può richiedere qualche secondo)';
  try{
    const d=await api('/api/pool/more',{word:{it:c.word.it,en:c.word.en},add:Q.cap});
    const got=d.sentences||[];
    if(!got.length){$('#mst').textContent='Nessuna altra frase trovata per questa parola.';return;}
    let at=Q.i+1;while(at<Q.items.length&&Q.items[at].word.it===c.word.it)at++;
    const base=Q.items.filter(x=>x.word.it===c.word.it).length;
    Q.items.splice(at,0,...got.map((s,k)=>({word:c.word,s,k:base+k,of:base+got.length})));
    Q.items.filter(x=>x.word.it===c.word.it).forEach(x=>x.of=base+got.length);
    $('#mst').innerHTML=`<span class="ok">+${got.length} frasi</span> in coda${d.short?` · ${d.short} in meno del richiesto`:''}`;
  }catch(e){const m=$('#mst');if(m)m.innerHTML=`<span style="color:var(--bad);font-weight:600">${esc(e.message)}</span>`;}
  finally{const bb=$('#more');if(bb)bb.disabled=false;}
}
let pending=Promise.resolve();
function grade(k){
  if(!Q.revealed)return;const c=Q.items[Q.i],ease=GR[k][1],rec={c,ease,written:null,msg:''};Q.res.push(rec);
  pending=pending.then(()=>post(rec));Q.i++;lessonMore();renderCard();
}
async function post(rec){
  if(rec.c.s.cardId==null){rec.written=false;rec.msg='nessuna carta Anki';return;}
  try{
    const d=await api('/cards/answer',{reviews:[{cardId:rec.c.s.cardId,ease:rec.ease}]});
    const r=d.results&&d.results[0];rec.written=r?!!r.written:(d.ok!==false&&(d.written??1)>0);
    if(!rec.written)rec.msg=(r&&(r.error||r.detail))||d.detail||'';setBanner('');
  }catch(e){rec.written=false;rec.msg=e.message;setBanner(e.status===503?'Anki non raggiungibile — apri Anki':'Voti non scritti: '+e.message);}
}
async function summary(early){
  await pending;const t={};Q.res.forEach(r=>t[r.ease]=(t[r.ease]||0)+1);
  const nw=Q.res.filter(r=>!r.written),weak=[...new Set(Q.res.filter(r=>r.ease==='again'||r.ease==='hard').map(r=>Q.lessonMode?r.c.s.it:r.c.word.it))];
  $('#drill').innerHTML=`<div class="dh"><b>${early?'Sessione interrotta':'Sessione completata'}</b><span class="hint">${Q.res.length} di ${Q.items.length} frasi</span><button class="x" id="dx">✕</button></div>
    <div class="face"><div class="tally">${GR.map(([T,k])=>`<span class="chip">${T} × ${t[k]||0}</span>`).join('')}</div>
    ${weak.length?`<div><label class="l">Da riascoltare</label><div class="wlist" style="justify-content:center">${weak.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div></div>`:''}
    <div>${nw.length?`<span style="color:var(--bad);font-weight:600">⚠ ${nw.length} non scritte in Anki</span><div class="hint">${nw.map(r=>esc(r.c.s.it.slice(0,40))+(r.msg?' — '+esc(r.msg):'')).join('<br>')}</div>`:'<span class="ok">✓ tutti i voti scritti in Anki</span>'}</div>
    <div class="acts"><button class="btn pri" id="again">Nuova sessione</button></div></div>`;
  $('#dx').onclick=closeDrill;$('#again').onclick=closeDrill;
}
// ---------- lesson mode: /ascolto?lesson=<id> or ?focus=<tag> or ?collection=<id> (a Raccolta, /api/collections/<id>/cards) ----------
// Cards come from the lessons themselves (listening.index.json), a page at a time: each page is voiced + noted
// server-side, so only fetch the next one when the learner is nearly through the queue.
const LPAGE=5;
async function lessonMore(){
  const L=Q.lesson;if(!L||L.next==null||Q.fetching||Q.items.length-Q.i>3)return;
  Q.fetching=Q.loading=true;
  try{
    const p=new URLSearchParams({n:LPAGE,offset:L.next});
    if(QS.get('dry'))p.set('dry','1');   // ?dry=1: no voice, no Anki note (checks / demos)
    if(L.id)p.set('id',L.id);else if(L.focus)p.set('focus',L.focus);
    const d=await api(L.coll?'/api/collections/'+encodeURIComponent(L.coll)+'/cards?'+p:'/api/pool/lesson?'+p);
    Q.items.push(...d.sentences.map((s,k)=>({word:{it:d.lesson.title,en:'',audio:null},s,k:d.offset+k,of:d.total})));
    L.next=d.next;
  }catch(e){L.next=null;setBanner(e.message);}
  Q.fetching=Q.loading=false;
  if(Q.waiting)renderCard();
  else if(Q.items.length-Q.i<=3&&L.next!=null)lessonMore();
}
async function startLesson(id,focus,coll){
  Q.lessonMode=true;Q.lesson={id,focus,coll,next:0};Q.cap=LPAGE;setBanner('');
  $('#setup').classList.add('hide');
  $('#drill').innerHTML='<div class="spin"><i></i><span>Preparo le carte della lezione…</span></div>';
  await lessonMore();
  if(!Q.items.length){$('#drill').innerHTML='';$('#setup').classList.remove('hide');return;}
  startDrill();
}
// ---------- setup ----------
function parseWords(){return $('#words').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [it,en]=l.split('|').map(x=>x.trim());return {it,en:en||''};});}
async function loadWeak(){
  $('#mm-note').textContent='…';
  try{
    const d=await api('/api/pool/weak?limit=10');const ws=d.words||[];
    if(!ws.length){$('#mm-note').textContent='Nessuna parola debole salvata da Match Madness.';return [];}
    $('#words').value=ws.map(w=>w.it+(w.en?' | '+w.en:'')).join('\n');
    $('#mm-note').textContent=ws.length+' parole da Match Madness';return ws;
  }catch(e){$('#mm-note').textContent='';$('#status').innerHTML=`<div class="err">${esc(e.message)}</div>`;return [];}
}
async function go(){
  const ws=parseWords();if(!ws.length){$('#status').innerHTML='<div class="err">Scrivi almeno una parola</div>';return;}
  Object.assign(Q,{lessonMode:false,lesson:null,items:[],i:0,res:[],cap:+$('#cap').value||5,loading:true});setBanner('');
  $('#go').disabled=true;let started=false;const failed=[];
  const st=$('#status');st.innerHTML=`<div class="spin"><i></i><span>Raccolgo le frasi… <b>0</b>/${ws.length}</span></div>`;
  for(let n=0;n<ws.length;n++){
    try{
      const d=await api('/api/pool/gather',{words:[ws[n]],cap:Q.cap});const it=d.items[0];
      if(!it.sentences.length)failed.push(ws[n].it);
      else{
        Q.items.push(...it.sentences.map((s,k)=>({word:it.word,s,k,of:it.sentences.length})));
        if(!started){started=true;startDrill();}else if(Q.waiting)renderCard();
      }
    }catch(e){failed.push(ws[n].it+' ('+e.message+')');if(e.status===503)setBanner(e.message);}
    const b=st.querySelector('b');if(b)b.textContent=n+1;
  }
  Q.loading=false;$('#go').disabled=false;
  st.innerHTML=failed.length?`<div class="err">Nessuna frase per: ${esc(failed.join(' · '))}</div>`:'';
  if(Q.waiting)renderCard();else{const d=$('#drill .dot');if(d)d.remove();}
}
$('#mm').onclick=loadWeak;$('#go').onclick=go;
// ?mode=pool&from=mm  -> load the weak list and start straight away
if(QS.get('collection'))startLesson(null,null,QS.get('collection'));
else if(QS.get('lesson')||QS.get('focus'))startLesson(QS.get('lesson'),QS.get('focus'));
// ?w=<it>|<en>&w=...  -> drill exactly these words (Match Madness end-card "Ascolta queste parole"); nothing is pushed or counted
else if(QS.getAll('w').length){$('#words').value=QS.getAll('w').join('\n');go();}
else if(QS.get('from')==='mm')loadWeak().then(ws=>{if(ws.length)go();});
</script></body></html>
