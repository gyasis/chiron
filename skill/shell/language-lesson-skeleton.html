<!DOCTYPE html>
<html lang="{{LANG_CODE}}" data-theme="linguistic" data-view="lesson" data-skeleton="language-lesson-skeleton-v1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- meta name="chiron-lesson-id" content="{{LESSON_ID}}" -->
  <title>Chiron · <!-- {{COURSE_TITLE}} --></title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Theme tokens + variants (BLOCKING contract) -->
  <link rel="stylesheet" href="themes/_tokens.css" />
  <link rel="stylesheet" href="themes/midnight.css" />
  <link rel="stylesheet" href="themes/warm-paper.css" />
  <link rel="stylesheet" href="themes/clinical.css" />
  <link rel="stylesheet" href="themes/linguistic.css" />
  <link rel="stylesheet" href="themes/ocean.css" />

  <!-- Early theme apply: reads ?theme= or localStorage, falls back to 'linguistic' -->
  <script>
    (function () {
      var valid = ['linguistic','midnight','warm-paper','clinical','ocean'];
      var params = new URLSearchParams(location.search);
      var t = params.get('theme');
      var stored = localStorage.getItem('chiron-theme');
      var theme = valid.includes(t) ? t : (valid.includes(stored) ? stored : 'linguistic');
      document.documentElement.setAttribute('data-theme', theme);
      if (t) localStorage.setItem('chiron-theme', t);
    })();
  </script>

  <!-- audio/manifest.js sets window.__chironAudioManifest; no-op if absent -->
  <script src="audio/manifest.js" defer></script>

  <style>
    /* =========================================================================
       LANGUAGE-LESSON-SKELETON v1 — component CSS
       All colors consume var(--chiron-*). No hardcoded hex/rgb in component CSS.
       Exception: the .chiron-listen* / .chiron-play-inline blocks below carry
       their own fallback values (rgba(0,0,0,.16) etc.) for environments where
       themes/_tokens.css may not be loaded — those are token fallbacks, not
       design decisions.
       ========================================================================= */

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      display: grid; grid-template-columns: 240px 1fr; min-height: 100vh;
      background: var(--chiron-bg);
      color: var(--chiron-fg);
      font-family: var(--chiron-font-body);
      font-size: 17px;
      line-height: 1.65;
    }

    /* ---- Sidebar ---- */
    aside.side {
      background: var(--chiron-bg);
      border-right: 1px solid var(--chiron-divider);
      padding: 1.75rem 1.25rem 1.25rem;
      overflow-y: auto;
      height: 100vh;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
    }
    .side .brand { font-family: var(--chiron-font-heading); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; color: var(--chiron-fg); }
    .side .brand .dot { color: var(--chiron-accent); }
    .side .sub { font-size: 0.72rem; color: var(--chiron-muted); margin-top: 3px; line-height: 1.45; padding-bottom: 1.25rem; border-bottom: 1px solid var(--chiron-divider); }
    .side .toc-header { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: var(--chiron-muted); margin: 1.25rem 0 0.5rem; }
    .side nav.toc-nav { display: flex; flex-direction: column; gap: 1px; }
    .side .toc-link {
      display: flex; align-items: baseline; gap: 10px;
      padding: 7px 10px 7px 12px;
      border-left: 2px solid transparent;
      border-radius: 0 6px 6px 0;
      color: var(--chiron-fg-secondary); text-decoration: none;
      font-size: 0.9rem; line-height: 1.3;
      transition: color .12s ease, background .12s ease, border-color .12s ease;
    }
    .side .toc-link:hover { background: var(--chiron-elevated); color: var(--chiron-fg); }
    .side .toc-link.active, .side .toc-link[aria-current="true"] {
      color: var(--chiron-accent); border-left-color: var(--chiron-accent); font-weight: 600;
      background: color-mix(in srgb, var(--chiron-accent) 20%, transparent);
    }
    .side .toc-num { font-variant-numeric: tabular-nums; color: var(--chiron-muted); font-size: 0.7rem; flex-shrink: 0; opacity: 0.65; }
    .side .toc-link.active .toc-num { color: var(--chiron-accent); opacity: 1; }
    .side .toc-title { flex: 1; }
    .side .theme-section { margin-top: auto; }
    .side .toc-header.theme-section { padding-top: 1.25rem; border-top: 1px solid var(--chiron-divider); margin-top: auto; }

    /* ---- Theme bar (lives in sidebar, pinned to bottom via margin-top:auto) ---- */
    .theme-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 0.5rem; }
    .theme-bar button {
      font: inherit; font-size: 10px; padding: 4px 9px;
      background: transparent;
      color: var(--chiron-muted);
      border: 1px solid var(--chiron-border);
      border-radius: 100px;
      cursor: pointer; transition: all .12s ease;
    }
    .theme-bar button:hover { background: var(--chiron-elevated); color: var(--chiron-fg); }
    .theme-bar button[aria-pressed="true"] { background: var(--chiron-accent); color: #fff; border-color: var(--chiron-accent); }

    /* ---- Main content column ---- */
    main.main { overflow-y: auto; height: 100vh; }

    /* ---- Layout shell (content max-width) ---- */
    .lesson-shell { max-width: 920px; margin: 0 auto; padding: var(--chiron-space-8) var(--chiron-space-6); }

    /* ---- Header ---- */
    .lesson-header { border-bottom: 1px solid var(--chiron-divider); padding-bottom: var(--chiron-space-6); margin-bottom: var(--chiron-space-8); }
    .eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; color: var(--chiron-muted); font-family: var(--chiron-font-body); font-weight: 600; }
    h1.lesson-title { font-family: var(--chiron-font-heading); font-size: 2.6rem; line-height: 1.1; margin: var(--chiron-space-2) 0 var(--chiron-space-3); color: var(--chiron-fg); }
    .subtitle { color: var(--chiron-fg-secondary); font-size: 1.1rem; font-style: italic; }

    /* ---- Sections ---- */
    section.lesson-section { margin: var(--chiron-space-8) 0; scroll-margin-top: var(--chiron-space-6); }
    h2.section-h {
      font-family: var(--chiron-font-heading);
      font-size: 1.55rem;
      color: var(--chiron-accent);
      border-left: 4px solid var(--chiron-accent);
      padding-left: var(--chiron-space-4);
      margin: 0 0 var(--chiron-space-4);
    }
    h2.section-h .num { color: var(--chiron-muted); font-size: 0.7em; font-weight: 400; margin-right: var(--chiron-space-3); font-family: var(--chiron-font-mono, monospace); }
    h3.subsection-h { font-family: var(--chiron-font-heading); color: var(--chiron-fg-secondary); margin-top: var(--chiron-space-6); font-size: 1.15rem; }

    /* ---- Cold open ---- */
    .cold-open {
      background: var(--chiron-surface);
      border-radius: var(--chiron-radius-lg);
      padding: var(--chiron-space-6) var(--chiron-space-8);
      box-shadow: var(--chiron-shadow-md);
      border-left: 4px solid var(--chiron-warm-accent);
      font-family: var(--chiron-font-heading);
      font-size: 1.18rem;
      line-height: 1.6;
      color: var(--chiron-fg);
      font-style: italic;
    }
    .cold-open .it { color: var(--chiron-fg); font-style: italic; }
    .cold-open .gloss { color: var(--chiron-muted); font-size: 0.9em; display: block; margin-top: var(--chiron-space-2); font-style: normal; }

    /* ---- Vocab arc ---- */
    .vocab-arc { background: var(--chiron-surface); border-radius: var(--chiron-radius-lg); padding: var(--chiron-space-6); margin-bottom: var(--chiron-space-6); border: 1px solid var(--chiron-border); }
    .mini-context { font-style: italic; color: var(--chiron-fg-secondary); border-left: 3px solid var(--chiron-accent-light); padding-left: var(--chiron-space-3); margin-bottom: var(--chiron-space-4); }

    /* ---- Tables ---- */
    .v-table { border-collapse: collapse; width: 100%; margin: var(--chiron-space-3) 0; }
    .v-table th, .v-table td { padding: var(--chiron-space-3); text-align: left; border-bottom: 1px solid var(--chiron-divider); }
    .v-table th { background: var(--chiron-elevated); font-family: var(--chiron-font-heading); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--chiron-fg); }
    .v-table td.it { font-weight: 600; color: var(--chiron-accent); font-family: var(--chiron-font-heading); }
    .v-table td.ex { font-style: italic; color: var(--chiron-fg-secondary); font-size: 0.95em; }

    /* ---- Speaker turns ---- */
    .turn { display: grid; grid-template-columns: 100px 1fr; gap: var(--chiron-space-3); margin: var(--chiron-space-3) 0; align-items: start; }
    .turn .speaker { font-family: var(--chiron-font-heading); font-weight: 700; font-size: 0.95em; padding: 2px 8px; border-radius: var(--chiron-radius-sm); text-align: center; }
    /* Speaker role colours — add more .turn.<role> blocks as needed for your personas */
    .turn.narrator .speaker { background: var(--chiron-elevated); color: var(--chiron-fg); border: 1px solid var(--chiron-border); }
    .turn.persona-a .speaker { background: var(--chiron-warm-accent); color: var(--chiron-surface); }
    .turn.persona-b .speaker { background: var(--chiron-accent); color: var(--chiron-surface); }
    .turn.learner .speaker { background: var(--chiron-elevated); color: var(--chiron-fg); border: 1px solid var(--chiron-border); }
    .turn .what { line-height: 1.55; }
    .turn .it { color: var(--chiron-fg); }
    .turn .gloss { color: var(--chiron-muted); font-size: 0.88em; display: block; margin-top: 2px; font-style: italic; }

    /* ---- Pedagogical callouts ---- */
    .callout { padding: var(--chiron-space-3) var(--chiron-space-4); margin: var(--chiron-space-3) 0; border-radius: var(--chiron-radius-md); border-left: 3px solid var(--chiron-info); background: var(--chiron-elevated); font-size: 0.95em; }
    .callout .tag { display: inline-block; font-family: var(--chiron-font-heading); font-weight: 700; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: var(--chiron-radius-sm); margin-right: var(--chiron-space-2); }
    .callout.grammar-pearl { border-left-color: var(--chiron-accent); }
    .callout.grammar-pearl .tag { background: var(--chiron-accent); color: var(--chiron-surface); }
    .callout.cultural-note { border-left-color: var(--chiron-warm-accent); }
    .callout.cultural-note .tag { background: var(--chiron-warm-accent); color: var(--chiron-surface); }
    .callout.tip { border-left-color: var(--chiron-info); }
    .callout.tip .tag { background: var(--chiron-info); color: var(--chiron-surface); }

    /* ---- Inline cloze ---- */
    .cloze-wrap { margin: var(--chiron-space-5) 0; }
    .cloze-line { background: var(--chiron-bg); border: 1px dashed var(--chiron-border); padding: var(--chiron-space-3); margin: var(--chiron-space-3) 0; border-radius: var(--chiron-radius-sm); font-style: italic; }
    .cloze-line input[type="text"] { font: inherit; padding: 3px 8px; width: 160px; border: 1px solid var(--chiron-border); border-radius: var(--chiron-radius-sm); background: var(--chiron-surface); color: var(--chiron-fg); font-style: normal; }
    .cloze-line input.correct { border-color: var(--chiron-success); background: var(--chiron-elevated); }
    .cloze-line input.incorrect { border-color: var(--chiron-error); }
    .cloze-line .hint { color: var(--chiron-muted); font-size: 0.85em; margin-left: var(--chiron-space-2); font-style: normal; }
    .cloze-reveal-btn { font: inherit; font-size: 0.82em; padding: 4px 10px; margin-left: var(--chiron-space-2); border: 1px solid var(--chiron-border); border-radius: var(--chiron-radius-sm); background: var(--chiron-surface); color: var(--chiron-fg-secondary); cursor: pointer; }
    .cloze-reveal-btn:hover { background: var(--chiron-elevated); }
    .cloze-answer { display: none; color: var(--chiron-accent); font-style: normal; font-weight: 600; margin-left: var(--chiron-space-2); }
    .cloze-answer.shown { display: inline; }

    /* ---- SR deck ---- */
    .sr-deck { display: grid; gap: var(--chiron-space-3); grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); margin-top: var(--chiron-space-4); }
    .sr-card { background: var(--chiron-surface); border: 1px solid var(--chiron-border); border-radius: var(--chiron-radius-md); padding: var(--chiron-space-4); cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; box-shadow: var(--chiron-shadow-sm); min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--chiron-font-heading); }
    .sr-card:hover { transform: translateY(-2px); box-shadow: var(--chiron-shadow-md); }
    .sr-card .front { font-size: 1.08em; color: var(--chiron-accent); font-weight: 600; }
    .sr-card .back { font-size: 0.95em; color: var(--chiron-fg-secondary); display: none; }
    .sr-card.flipped .front { display: none; }
    .sr-card.flipped .back { display: block; }

    /* Rich SR card (data-card-type) */
    .sr-card[data-card-type] {
      min-height: 150px;
      padding: var(--chiron-space-4);
      display: flex; align-items: stretch; justify-content: center; text-align: center;
      overflow: hidden; position: relative;
    }
    .sr-card[data-card-type] .front {
      display: flex; align-items: center; justify-content: center; width: 100%;
      font-size: 1.15em; color: var(--chiron-accent); font-weight: 700; line-height: 1.3;
    }
    .sr-card[data-card-type] .back {
      text-align: left; width: 100%; display: none; flex-direction: column; gap: var(--chiron-space-2);
    }
    .sr-card.flipped[data-card-type] .front { display: none; }
    .sr-card.flipped[data-card-type] .back { display: flex; }
    .sr-card.flipped[data-card-type='phrase'] { min-height: 200px; }

    .sr-back-head { display: flex; align-items: center; justify-content: space-between; gap: var(--chiron-space-2); padding-bottom: var(--chiron-space-2); border-bottom: 1px dashed var(--chiron-divider); margin-bottom: var(--chiron-space-2); }
    .sr-back-gloss { color: var(--chiron-fg); font-family: var(--chiron-font-heading); font-size: 0.92em; font-weight: 700; line-height: 1.3; }
    .sr-back-tag { font-family: var(--chiron-font-mono, monospace); font-size: 0.65em; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: var(--chiron-radius-sm); background: var(--chiron-elevated); color: var(--chiron-muted); flex-shrink: 0; }
    .sr-back-tag.sr-article { background: var(--chiron-accent-light); color: var(--chiron-accent); font-weight: 700; font-size: 0.78em; text-transform: none; letter-spacing: 0; }
    .sr-back-full { margin: 0; font-size: 0.86em; color: var(--chiron-fg-secondary); }
    .sr-back-full .sr-it { color: var(--chiron-fg); font-style: italic; }
    .sr-back-note { margin: 0; font-size: 0.78em; color: var(--chiron-fg-secondary); line-height: 1.45; }
    .sr-back-example { margin: 0; font-size: 0.82em; color: var(--chiron-fg-secondary); font-style: italic; }

    .sr-conj-table { width: 100%; border-collapse: collapse; font-size: 0.78em; font-family: var(--chiron-font-body); }
    .sr-conj-table thead th { text-align: center; padding: var(--chiron-space-1) 0 var(--chiron-space-2); color: var(--chiron-muted); font-weight: 600; font-family: var(--chiron-font-mono, monospace); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.85em; border-bottom: 1px solid var(--chiron-divider); }
    .sr-conj-table tbody th { text-align: left; padding: var(--chiron-space-1) var(--chiron-space-2) var(--chiron-space-1) 0; color: var(--chiron-muted); font-weight: 500; font-size: 0.92em; width: 45%; }
    .sr-conj-table tbody td { text-align: right; padding: var(--chiron-space-1) 0; color: var(--chiron-fg); font-family: var(--chiron-font-heading); font-weight: 600; }
    .sr-conj-table tbody tr + tr th, .sr-conj-table tbody tr + tr td { border-top: 1px dotted var(--chiron-divider); }
    .sr-tense-label { display: flex; flex-direction: column; gap: 1px; }
    .sr-tense-it { font-size: 0.92em; color: var(--chiron-muted); }
    .sr-tense-aspect { font-size: 0.75em; color: var(--chiron-muted); font-style: italic; }

    /* ---- Closing / summary block ---- */
    .closing { background: var(--chiron-surface); border-radius: var(--chiron-radius-lg); padding: var(--chiron-space-6); border-left: 4px solid var(--chiron-warm-accent); }

    footer.lesson-footer { margin-top: var(--chiron-space-8); padding-top: var(--chiron-space-4); border-top: 1px solid var(--chiron-divider); color: var(--chiron-muted); font-size: 0.85em; text-align: center; }

    /* ---- Chiron Listen mode — copied verbatim from styles.css ---- */
    .chiron-listen {
      position: fixed; right: 18px; bottom: 18px; z-index: 9999;
      width: 230px; max-width: calc(100vw - 36px);
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #e2e2e2);
      border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.16);
      font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden;
    }
    .chiron-listen-head {
      display: flex; align-items: center; gap: 7px;
      font-weight: 700; font-size: 13px;
      padding: 11px 14px; border-bottom: 1px solid var(--color-border-light, #eee);
      color: var(--color-text, #1a1a1a);
    }
    .chiron-listen-list { display: flex; flex-direction: column; padding: 6px; gap: 2px; max-height: 46vh; overflow-y: auto; }
    .chiron-listen-btn {
      display: flex; align-items: center; gap: 9px; text-align: left;
      background: transparent; border: 0; border-radius: 9px; padding: 9px 11px;
      cursor: pointer; font: inherit; font-size: 13px; line-height: 1.25;
      color: var(--color-text, #1a1a1a); transition: background .12s ease;
    }
    .chiron-listen-btn:hover { background: var(--color-accent-light, #f3f3f3); }
    .chiron-listen-btn .ico {
      flex: none; width: 18px; height: 18px; display: grid; place-items: center;
      font-size: 10px; color: var(--color-accent, #D94F30);
    }
    .chiron-listen-btn.playing { background: var(--color-accent-light, #f3f3f3); font-weight: 600; }
    .chiron-listen-btn.err .lbl { color: var(--color-error, #c0392b); }
    .chiron-listen-kind { font-size: 11px; color: var(--color-text-muted, #888); font-weight: 400; }
    .chiron-listen-group { padding: 6px; }
    .chiron-listen-group + .chiron-listen-group { border-top: 1px solid var(--chiron-divider, #eee); }
    .chiron-listen-grouptitle { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--chiron-muted, #999); padding: 4px 11px 5px; }
    .chiron-play-inline { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 8px; vertical-align: middle; flex: none; background: var(--chiron-accent, #2A7B9B); color: #fff; border: 1.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.28); border-radius: 50%; cursor: pointer; font: inherit; line-height: 1; transition: transform .1s ease, box-shadow .12s ease; }
    .chiron-play-inline .ico { font-size: 10px; margin-left: 1px; }   /* optical-center the ▶ */
    .chiron-play-inline:hover { transform: scale(1.12); box-shadow: 0 2px 7px rgba(0,0,0,.34); }
    .chiron-play-inline.playing { background: var(--chiron-accent-hover, #1F6280); }
    .chiron-play-inline.err { background: var(--chiron-error, #c0392b); }
    .chiron-has-audio { scroll-margin-top: 84px; }
    /* whole-lesson + section audio, hosted in the left sidebar */
    .chiron-listen-side { margin-top: var(--chiron-space-5, 1.25rem); padding-top: var(--chiron-space-4, 1rem); border-top: 1px solid var(--chiron-divider, #eee); }
    .chiron-side-head { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--chiron-muted, #888); margin-bottom: 4px; }
    .chiron-side-grouptitle { font-size: 10px; font-weight: 600; color: var(--chiron-muted, #999); margin: 8px 0 2px; }
    .chiron-side-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer; font: inherit; font-size: 13px; color: var(--chiron-fg, #1a1a1a); }
    .chiron-side-btn:hover { background: var(--chiron-elevated, #eee); }
    .chiron-side-btn.playing { background: var(--chiron-accent-light, #eee); font-weight: 600; }
    .chiron-side-btn .ico { flex: none; width: 18px; height: 18px; display: grid; place-items: center; font-size: 9px; color: #fff; background: var(--chiron-accent, #b3522e); border: 1px solid #fff; border-radius: 50%; }
    .chiron-side-btn.err .ico { background: var(--chiron-error, #a93423); }
    .chiron-listening {
      border-radius: 10px; scroll-margin-top: 84px;
      animation: chiron-listening-glow 1.7s ease-in-out infinite;
    }
    @keyframes chiron-listening-glow {
      0%, 100% { box-shadow: 0 0 0 0 var(--color-accent-muted, rgba(217,79,48,.28)); }
      50%      { box-shadow: 0 0 0 7px var(--color-accent-muted, rgba(217,79,48,.16)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .chiron-listening { animation: none; outline: 2px solid var(--color-accent, #D94F30); }
    }

    /* ---- Responsive: collapse sidebar to top strip on narrow screens ---- */
    @media (min-width: 769px) and (max-width: 880px) {
      body { grid-template-columns: 1fr; }
      aside.side {
        position: relative; height: auto;
        border-right: none; border-bottom: 1px solid var(--chiron-border);
        padding: var(--chiron-space-3) var(--chiron-space-4);
        display: flex; flex-wrap: nowrap; align-items: center; gap: var(--chiron-space-4);
        overflow-x: auto; overflow-y: hidden;
      }
      .side .brand { white-space: nowrap; flex-shrink: 0; }

      .side .toc-header { display: none; }
      .side nav.toc-nav {

        flex-wrap: nowrap; overflow-x: auto;
        flex: 1;
      }
      .side .toc-link {

        padding: var(--chiron-space-2) var(--chiron-space-2);
      }
      .side .toc-num { display: none; }
      .side .theme-section { display: none; }
      main.main { height: auto; overflow-y: visible; }
      .lesson-shell { padding: var(--chiron-space-5) var(--chiron-space-4); }
    }

    /* ── MOBILE LAYER — copied from skill/shell/main.js MOBILE RESPONSIVE LAYER
       + styles.css @media≤768px, tokens remapped to --chiron-* (2026-06-12)
       Token map used:
         --color-surface       → var(--chiron-surface)
         --color-border        → var(--chiron-border)
         --color-border-light  → var(--chiron-divider)
         --color-accent        → var(--chiron-accent)
         --color-accent-hover  → var(--chiron-accent-light)
         --color-accent-light  → color-mix(in srgb, var(--chiron-accent) 15%, transparent)
         --color-text          → var(--chiron-fg)
         --color-text-secondary→ var(--chiron-fg-secondary)
         --color-text-muted    → var(--chiron-muted)
         --color-bg-warm       → var(--chiron-elevated)
         --radius-sm           → var(--chiron-radius-sm)
         --radius-full         → 100px
         --duration-fast       → 0.15s
         --duration-normal     → 0.25s
         --ease-out            → ease-out
         --shadow-md           → var(--chiron-shadow-md)
         --space-N             → var(--chiron-space-N)
         --font-mono           → var(--chiron-font-mono)
         --font-display        → var(--chiron-font-heading)
         --text-sm             → 0.875rem
         --text-xs             → 0.75rem
         --text-xl             → 1.25rem
         --leading-snug        → 1.35
    ────────────────────────────────────────────────────────────────────────── */

    /* ── Hamburger button — hidden above 768px ──────────────────────── */
    .chiron-hamburger { display: none; }
    /* ── TOC Drawer backdrop — hidden on desktop ──────────────────── */
    .chiron-drawer-backdrop { display: none; }
    /* ── Bottom-bar mini-player — hidden on desktop ──────────────── */
    .chiron-bottom-bar { display: none; }
    /* ── Full-screen now-playing overlay — hidden on desktop ─────── */
    .chiron-fs-overlay { display: none; }

    @media (max-width: 768px) {

      /* ── Feature A — Hamburger button ────────────────────────────── */
      .chiron-hamburger {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: var(--chiron-space-3);
        left: var(--chiron-space-3);
        z-index: 10100;
        width: 44px;
        height: 44px;
        background: var(--chiron-surface);
        border: 1px solid var(--chiron-border);
        border-radius: var(--chiron-radius-sm);
        box-shadow: var(--chiron-shadow-md);
        cursor: pointer;
        font-size: 1.25rem;
        color: var(--chiron-fg);
        transition: background 0.15s;
        padding: 0;
        font-family: inherit;
      }
      .chiron-hamburger:hover { background: var(--chiron-elevated); }

      /* ── Feature A — TOC Drawer backdrop ─────────────────────────── */
      .chiron-drawer-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 10050;
        background: rgba(0,0,0,0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease-out;
      }
      .chiron-drawer-backdrop.open { opacity: 1; pointer-events: auto; }

      /* ── Feature A — Override the 880px top-strip rule: sidebar goes off-canvas ── */
      /* On ≤768px the 880px rule fires first (grid collapses) and puts the sidebar
         inline. We override to make it a fixed off-canvas drawer instead. */
      body { display: block !important; padding-top: 0; }
      aside.side {
        position: fixed !important;
        top: 0;
        left: 0;
        height: 100dvh !important;
        height: 100vh !important;
        width: min(280px, 85vw) !important;
        z-index: 10060;
        transform: translateX(-110%);
        transition: transform 0.25s ease-out;
        border-right: 1px solid var(--chiron-border) !important;
        border-bottom: none !important;
        overflow-y: auto;
        display: block !important;
        padding: 1.75rem 1.25rem 1.25rem !important;
        /* Re-enable flex-direction column (overrides the 880px row layout) */
        flex-direction: column;
      }
      aside.side.drawer-open { transform: translateX(0); }

      /* ── Feature A — main area full-width on mobile ────────────── */
      main.main {
        height: auto !important;
        overflow-y: visible !important;
        padding-top: 56px;
      }

      /* ── Feature A — body scroll-lock (also used by full-screen overlay) ── */
      body.drawer-scroll-lock,
      body.chiron-fs-lock {
        overflow: hidden !important;
        padding-right: 0;
      }

      /* ── Feature B — hide desktop float player on mobile ────────── */
      .chiron-listen { display: none !important; }

      /* ── Feature B — Bottom-bar mini-player ─────────────────────── */
      .chiron-bottom-bar {
        display: flex;
        flex-direction: column;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 9998;
        background: var(--chiron-surface);
        border-top: 1px solid var(--chiron-border);
        box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
        max-height: 70px;
        transition: max-height 0.25s ease-out;
        overflow: hidden;
      }
      .chiron-bottom-bar.sheet-open { max-height: min(70vh, 540px); }

      /* Progress fill line */
      .chiron-bar-progress-line {
        height: 3px;
        width: 0%;
        background: var(--chiron-accent);
        transition: width 200ms linear;
        flex-shrink: 0;
      }

      /* Main row */
      .chiron-bar-row {
        display: flex;
        align-items: center;
        gap: var(--chiron-space-2);
        padding: 0 var(--chiron-space-3);
        height: 64px;
        flex-shrink: 0;
        cursor: default;
        touch-action: none;
        overflow: hidden;
      }

      /* Shared icon-button base */
      .chiron-bar-prev-btn,
      .chiron-bar-next-btn,
      .chiron-bar-expand-btn,
      .chiron-bar-fs-btn {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        color: var(--chiron-fg-secondary);
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--chiron-radius-sm);
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
        transition: color 0.15s, background 0.15s;
      }
      .chiron-bar-prev-btn:hover,
      .chiron-bar-next-btn:hover,
      .chiron-bar-expand-btn:hover,
      .chiron-bar-fs-btn:hover { background: var(--chiron-elevated); color: var(--chiron-fg); }
      .chiron-bar-prev-btn:disabled,
      .chiron-bar-next-btn:disabled { opacity: 0.3; pointer-events: none; }

      /* Main play/pause circle */
      .chiron-bar-play-btn {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--chiron-accent);
        color: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background 0.15s, transform 0.15s;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      .chiron-bar-play-btn:active { transform: scale(0.92); }
      .chiron-bar-play-btn.idle {
        background: var(--chiron-border);
        color: var(--chiron-fg-secondary);
      }

      .chiron-bar-clip-name {
        flex: 1;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--chiron-fg);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .chiron-bar-clip-name.idle { color: var(--chiron-muted); font-weight: 400; }

      .chiron-bar-countdown {
        flex-shrink: 0;
        font-family: var(--chiron-font-mono);
        font-size: 0.75rem;
        color: var(--chiron-muted);
        min-width: 32px;
        text-align: right;
      }

      /* Sheet (clip list under bar) */
      .chiron-bar-sheet {
        overflow-y: auto;
        flex: 1;
        padding: var(--chiron-space-2) var(--chiron-space-3) var(--chiron-space-4);
        border-top: 1px solid var(--chiron-divider);
      }
      .chiron-bar-sheet-title {
        font-family: var(--chiron-font-mono);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--chiron-muted);
        padding: var(--chiron-space-2) var(--chiron-space-2) var(--chiron-space-3);
      }

      /* Shared clip-button style */
      .chiron-bar-clip-btn {
        display: flex;
        align-items: center;
        gap: var(--chiron-space-3);
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: var(--chiron-radius-sm);
        padding: var(--chiron-space-3) var(--chiron-space-2);
        font: inherit;
        font-size: 0.875rem;
        color: var(--chiron-fg);
        cursor: pointer;
        min-height: 44px;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.15s;
      }
      .chiron-bar-clip-btn:hover,
      .chiron-bar-clip-btn:active { background: var(--chiron-elevated); }
      .chiron-bar-clip-btn.playing {
        background: color-mix(in srgb, var(--chiron-accent) 15%, transparent);
        color: var(--chiron-accent);
        font-weight: 600;
      }
      .chiron-bar-clip-btn .ico {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        font-size: 10px;
        color: var(--chiron-accent);
      }

      /* Main content bottom padding so it clears the bar */
      main.main { padding-bottom: 80px; }

      /* ── Feature B — Full-screen now-playing overlay ─────────────── */
      .chiron-fs-overlay {
        display: flex;
        flex-direction: column;
        position: fixed;
        inset: 0;
        z-index: 10200;
        background: var(--chiron-surface);
        transform: translateY(100%);
        transition: transform 0.25s ease-out;
        overflow: hidden;
      }
      .chiron-fs-overlay.open { transform: translateY(0); }

      .chiron-fs-header {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--chiron-space-3) var(--chiron-space-4);
        flex-shrink: 0;
        border-bottom: 1px solid var(--chiron-divider);
      }
      .chiron-fs-close {
        width: 44px;
        height: 44px;
        border: none;
        background: transparent;
        color: var(--chiron-muted);
        font-size: 1.5rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 100px;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
      }
      .chiron-fs-close:hover { background: var(--chiron-elevated); }

      .chiron-fs-title {
        font-family: var(--chiron-font-heading);
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--chiron-fg);
        padding: var(--chiron-space-6) var(--chiron-space-6) var(--chiron-space-4);
        text-align: center;
        flex-shrink: 0;
        line-height: 1.35;
      }

      .chiron-fs-scrub-wrap {
        display: flex;
        align-items: center;
        gap: var(--chiron-space-3);
        padding: 0 var(--chiron-space-5) var(--chiron-space-4);
        flex-shrink: 0;
      }
      .chiron-fs-time {
        font-family: var(--chiron-font-mono);
        font-size: 0.75rem;
        color: var(--chiron-muted);
        min-width: 38px;
        flex-shrink: 0;
      }
      .chiron-fs-remaining { text-align: right; }

      .chiron-fs-scrub-track {
        flex: 1;
        height: 6px;
        border-radius: 100px;
        position: relative;
        cursor: pointer;
        touch-action: none;
        background: linear-gradient(
          to right,
          var(--chiron-accent) 0%,
          var(--chiron-accent) var(--fs-progress, 0%),
          var(--chiron-border) var(--fs-progress, 0%),
          var(--chiron-border) 100%
        );
      }
      .chiron-fs-scrub-thumb {
        position: absolute;
        top: 50%;
        left: 0%;
        transform: translate(-50%, -50%);
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--chiron-accent);
        box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        pointer-events: none;
      }

      .chiron-fs-transport {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--chiron-space-8);
        padding: var(--chiron-space-4) var(--chiron-space-6) var(--chiron-space-6);
        flex-shrink: 0;
      }
      .chiron-fs-prev,
      .chiron-fs-next {
        width: 52px;
        height: 52px;
        border: none;
        background: var(--chiron-elevated);
        color: var(--chiron-fg);
        font-size: 1.25rem;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
        transition: background 0.15s, transform 0.15s;
      }
      .chiron-fs-prev:hover,
      .chiron-fs-next:hover { background: var(--chiron-border); }
      .chiron-fs-prev:active,
      .chiron-fs-next:active { transform: scale(0.92); }
      .chiron-fs-prev:disabled,
      .chiron-fs-next:disabled { opacity: 0.3; pointer-events: none; }

      .chiron-fs-play {
        width: 68px;
        height: 68px;
        border: none;
        background: var(--chiron-accent);
        color: white;
        font-size: 1.5rem;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
        transition: background 0.15s, transform 0.15s;
      }
      .chiron-fs-play:hover { background: var(--chiron-accent-light); }
      .chiron-fs-play:active { transform: scale(0.94); }

      .chiron-fs-list-hdr {
        font-family: var(--chiron-font-mono);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--chiron-muted);
        padding: var(--chiron-space-2) var(--chiron-space-5) var(--chiron-space-2);
        flex-shrink: 0;
        border-top: 1px solid var(--chiron-divider);
      }
      .chiron-fs-clip-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 var(--chiron-space-4) var(--chiron-space-6);
      }
    }
    /* ── END MOBILE LAYER ─────────────────────────────────────────────── */
  </style>
</head>

        .mm-tile { font-family: var(--chiron-font-heading); font-size: 0.95em; font-weight: 600; padding: var(--chiron-space-3) var(--chiron-space-4); border: 1.5px solid var(--chiron-border); border-radius: var(--chiron-radius-md); background: var(--chiron-surface); color: var(--chiron-fg); cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease; text-align: left; line-height: 1.3; }
        .mm-tile:hover:not([disabled]) { background: var(--chiron-elevated); border-color: var(--chiron-accent-light); transform: translateY(-1px); }

      <script>
      (function () {
        /* EDIT THIS PAIRS ARRAY — 6-10 pairs recommended.
           id must be unique per pair; it is internal to the game only. */
        var PAIRS = [
          { id: 'p1', it: '{{TARGET_PHRASE_1}}', en: '{{ENGLISH_GLOSS_1}}' },
          { id: 'p2', it: '{{TARGET_PHRASE_2}}', en: '{{ENGLISH_GLOSS_2}}' },
          { id: 'p3', it: '{{TARGET_PHRASE_3}}', en: '{{ENGLISH_GLOSS_3}}' },
          { id: 'p4', it: '{{TARGET_PHRASE_4}}', en: '{{ENGLISH_GLOSS_4}}' },
          { id: 'p5', it: '{{TARGET_PHRASE_5}}', en: '{{ENGLISH_GLOSS_5}}' },
          { id: 'p6', it: '{{TARGET_PHRASE_6}}', en: '{{ENGLISH_GLOSS_6}}' },
          { id: 'p7', it: '{{TARGET_PHRASE_7}}', en: '{{ENGLISH_GLOSS_7}}' },
          { id: 'p8', it: '{{TARGET_PHRASE_8}}', en: '{{ENGLISH_GLOSS_8}}' }
        ];

        var matched = 0;
        var selectedIt = null;
        var selectedEn = null;

        function shuffle(arr) {
          var a = arr.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }

        function buildTile(text, side, pairId) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'mm-tile';
          btn.textContent = text;
          btn.dataset.pairId = pairId;
          btn.dataset.side = side;
          btn.addEventListener('click', function () { onTileClick(btn); });
          return btn;
        }

        function render() {
          matched = 0;
          selectedIt = null;
          selectedEn = null;
          document.getElementById('mm-count').textContent = '0';
          document.getElementById('mm-total').textContent = PAIRS.length;
          document.getElementById('mm-complete').classList.remove('visible');

          var itCol = document.getElementById('mm-it-col');
          var enCol = document.getElementById('mm-en-col');
          itCol.innerHTML = '';
          enCol.innerHTML = '';

          var itOrder = shuffle(PAIRS);
          var enOrder = shuffle(PAIRS);

          itOrder.forEach(function (p) { itCol.appendChild(buildTile(p.it, 'it', p.id)); });
          enOrder.forEach(function (p) { enCol.appendChild(buildTile(p.en, 'en', p.id)); });
        }

        function clearSelection(tile) {
          if (tile) { tile.classList.remove('mm-selected'); }
        }

        function onTileClick(tile) {
          if (tile.classList.contains('mm-matched') || tile.disabled) return;
          var side = tile.dataset.side;

          if (side === 'it' && selectedIt === tile) { clearSelection(tile); selectedIt = null; return; }
          if (side === 'en' && selectedEn === tile) { clearSelection(tile); selectedEn = null; return; }

          if (side === 'it') { clearSelection(selectedIt); selectedIt = tile; }
          else               { clearSelection(selectedEn); selectedEn = tile; }
          tile.classList.add('mm-selected');

          if (selectedIt && selectedEn) {
            var itId = selectedIt.dataset.pairId;
            var enId = selectedEn.dataset.pairId;
            if (itId === enId) {
              [selectedIt, selectedEn].forEach(function (t) {
                t.classList.remove('mm-selected');
                t.classList.add('mm-matched');
                t.disabled = true;
              });
              matched++;
              document.getElementById('mm-count').textContent = matched;
              selectedIt = null; selectedEn = null;
              if (matched === PAIRS.length) {
                document.getElementById('mm-complete').classList.add('visible');
              }
            } else {
              var badIt = selectedIt, badEn = selectedEn;
              [badIt, badEn].forEach(function (t) { t.classList.add('mm-wrong'); });
              selectedIt = null; selectedEn = null;
              setTimeout(function () {
                [badIt, badEn].forEach(function (t) { t.classList.remove('mm-wrong', 'mm-selected'); });
              }, 600);
            }
          }
        }

        document.getElementById('mm-reset').addEventListener('click', render);
        render();
      })();
      </script>

  <!-- TOC sidebar scroll-spy + smooth scroll
       The ids array MUST be kept in sync with the actual section ids used above.
       Update this list whenever chapters are added or removed. -->
  <script>
    (function () {
      var tocLinks = Array.from(document.querySelectorAll('.toc-link[data-toc-target]'));
      /* UPDATE THIS ARRAY to match the id values on your <section class="lesson-section"> elements: */
      var ids = ['overview', 'chapter-1', 'chapter-2', 'sr-drawer', 'match-madness', 'closing'];
      var mainEl = document.getElementById('main-content');

      tocLinks.forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var target = document.getElementById(link.getAttribute('data-toc-target'));
          if (!target) return;
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      function updateToc() {
        var scrollTop = (mainEl && mainEl.scrollHeight > mainEl.clientHeight)
          ? mainEl.scrollTop
          : window.scrollY;
        var viewH = (mainEl && mainEl.scrollHeight > mainEl.clientHeight)
          ? mainEl.clientHeight
          : window.innerHeight;
        var mid = scrollTop + viewH * 0.35;
        var activeId = null;
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          var top = el.offsetTop;
          if (top <= mid + 1) activeId = id;
        });
        tocLinks.forEach(function (link) {
          var isActive = link.getAttribute('data-toc-target') === activeId;
          link.classList.toggle('active', isActive);
          link.setAttribute('aria-current', isActive ? 'true' : 'false');
        });
      }

      if (mainEl) mainEl.addEventListener('scroll', updateToc, { passive: true });
      window.addEventListener('scroll', updateToc, { passive: true });
      updateToc();
    })();
  </script>

  <!-- Chiron Listen mode — audio lecture player + section voice-follow
       Copied VERBATIM from skill/shell/main.js (the last top-level IIFE).
       The player reads window.__chironAudioManifest (set by audio/manifest.js)
       or fetches audio/manifest.json directly. If neither is present it is a
       silent no-op — the lesson works fine without audio. -->
  <script>
(function () {
  'use strict';
  var PANEL_KIND = { summary: 0, shortened: 1, section: 2 };
  var INLINE_KIND = { dialogue: 1, phrase: 1, 'grammar-pearl': 1, 'story-verbatim': 1, 'story-description': 1 };

  var audio = new Audio();
  var active = null; // { btn, glowEl, idle }
  function setIco(btn, ch) { var i = btn.querySelector('.ico'); if (i) i.textContent = ch; }
  function clearActive() {
    if (!active) return;
    if (active.glowEl) active.glowEl.classList.remove('chiron-listening');
    if (active.btn) { active.btn.classList.remove('playing'); setIco(active.btn, active.idle); }
    active = null;
  }
  audio.addEventListener('ended', clearActive);

  function play(clip, btn, glowEl, idleIco) {
    if (active && active.btn === btn) { audio.pause(); audio.currentTime = 0; clearActive(); return; }
    clearActive();
    audio.src = clip.audioPath;
    audio.play().then(function () {
      active = { btn: btn, glowEl: glowEl || null, idle: idleIco };
      btn.classList.add('playing'); setIco(btn, '⏸');
      if (glowEl) { glowEl.classList.add('chiron-listening'); glowEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }).catch(function () { btn.classList.add('err'); setTimeout(function () { btn.classList.remove('err'); }, 1600); });
  }

  function panelLabel(c) {
    if (c.artifact === 'summary') return 'Summary';
    if (c.artifact === 'shortened') return 'Full lecture';
    if (c.sectionId) {
      var el = document.getElementById(c.sectionId);
      var h = el && el.querySelector('h1,h2,h3,[data-section-title]');
      if (h && h.textContent.trim()) return h.textContent.trim().replace(/^\s*\d+[\.\)]?\s*/, '');
    }
    return c.sectionId || 'Section';
  }

  function buildPanel(clips) {
    var panel = document.createElement('div');
    panel.className = 'chiron-listen';
    panel.innerHTML = '<div class="chiron-listen-head"><span>🎧</span><span>Listen</span></div>';
    function group(title, list) {
      if (!list.length) return;
      var g = document.createElement('div'); g.className = 'chiron-listen-group';
      var t = document.createElement('div'); t.className = 'chiron-listen-grouptitle'; t.textContent = title;
      g.appendChild(t);
      list.forEach(function (c) {
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'chiron-listen-btn';
        var ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = '▶';
        var lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = panelLabel(c);
        btn.appendChild(ico); btn.appendChild(lbl);
        btn.addEventListener('click', function () {
          var glow = (c.artifact === 'section' && c.sectionId) ? document.getElementById(c.sectionId) : null;
          play(c, btn, glow, '▶');
        });
        g.appendChild(btn);
      });
      panel.appendChild(g);
    }
    group('Full lesson', clips.filter(function (c) { return c.artifact === 'summary' || c.artifact === 'shortened'; }));
    group('By section', clips.filter(function (c) { return c.artifact === 'section'; }));
    document.body.appendChild(panel);
  }

  function wireInline(clips) {
    clips.forEach(function (c) {
      if (!c.sectionId) return;
      var el = document.getElementById(c.sectionId);
      if (!el) return;
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'chiron-play-inline'; btn.title = 'Listen'; btn.setAttribute('aria-label', 'Play audio');
      var ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = '▶'; btn.appendChild(ico);
      btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); play(c, btn, null, '▶'); });
      el.classList.add('chiron-has-audio');
      el.insertBefore(btn, el.firstChild);
    });
  }

  function useManifest(m) {
    if (!m || !m.clips) return;
    var ready = m.clips.filter(function (c) { return c.status === 'done' && c.audioPath; });
    if (!ready.length) return;
    var panelClips = ready.filter(function (c) { return PANEL_KIND[c.artifact] != null; });
    var inlineClips = ready.filter(function (c) { return INLINE_KIND[c.artifact]; });
    if (panelClips.length) buildPanel(panelClips);
    if (inlineClips.length) wireInline(inlineClips);
  }

  function init() {
    if (window.__chironAudioManifest) { useManifest(window.__chironAudioManifest); return; }
    fetch('audio/manifest.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(useManifest)
      .catch(function () { /* no audio baked — silent no-op */ });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
  </script>

// and decorates any audio control that still has a flagged defect with an ℹ️.
(function(){
  fetch('audio/qc-report.json').then(function(r){return r.ok?r.json():null;}).then(function(qc){
    if(!qc) return;
    var tries=0, iv=setInterval(function(){
      var btns=document.querySelectorAll('.chiron-listen-btn'); tries++;
      if(btns.length){ clearInterval(iv);
        btns.forEach(function(btn){

          var info=document.createElement('span'); info.className='chiron-qc-info'; info.textContent='i';
          info.title='Audio QC: '+rep.status+' — click for details';
          info.addEventListener('click',function(e){ e.stopPropagation();
            document.querySelectorAll('.chiron-qc-pop').forEach(function(p){p.remove();});
            var pop=document.createElement('div'); pop.className='chiron-qc-pop';

            setTimeout(function(){document.addEventListener('click',function h(){pop.remove();document.removeEventListener('click',h);});},0);
          });
          btn.appendChild(info);
        });
      }
      if(tries>40) clearInterval(iv);
    },150);
  }).catch(function(){});
})();

  <script>
(function () {

  /* ─── Feature B helpers ─────────────────────────────────────────── */
  function fmtTime(secs) {
    if (!isFinite(secs) || secs < 0) return '0:00';
    var s = Math.ceil(secs);
    var m = Math.floor(s / 60);
    var ss = s % 60;
    return m + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function setBarProgress(fraction) {
    if (!barProgress) return;
    barProgress.style.width = (Math.min(1, Math.max(0, fraction)) * 100) + '%';
  }

  function updateFsScrubber(fraction) {
    if (!fsScrubTrack) return;
    var pct = Math.min(1, Math.max(0, fraction)) * 100;
    fsScrubTrack.style.setProperty('--fs-progress', pct + '%');
    if (fsScrubThumb) fsScrubThumb.style.left = pct + '%';
  }

  function updateAllDisplays() {
    if (!mobileAudio || !activeClip) return;
    var dur = mobileAudio.duration;
    var ct  = mobileAudio.currentTime;
    var frac = (isFinite(dur) && dur > 0) ? ct / dur : 0;

    setBarProgress(frac);
    if (barCountdown) barCountdown.textContent = (isFinite(dur) && dur > 0) ? fmtTime(dur - ct) : '';

    updateFsScrubber(frac);
    if (fsElapsed)   fsElapsed.textContent   = fmtTime(ct);
    if (fsRemaining) fsRemaining.textContent = (isFinite(dur) && dur > 0) ? '-' + fmtTime(dur - ct) : '';

    mobileClips.forEach(function (c, i) {
      var btn = barSheet && barSheet.querySelector('[data-clip-idx="' + i + '"]');
      if (!btn) return;
      var playing = activeClip && activeClip.idx === i && !mobileAudio.paused;
      btn.classList.toggle('playing', playing);
      var ico = btn.querySelector('.ico');
      if (ico) ico.textContent = playing ? '⏸' : '▶';
    });

    if (fsClipList) {
      fsClipList.querySelectorAll('[data-clip-idx]').forEach(function (btn) {
        var i = parseInt(btn.getAttribute('data-clip-idx'), 10);
        var playing = activeClip && activeClip.idx === i && !mobileAudio.paused;
        btn.classList.toggle('playing', playing);
        var ico = btn.querySelector('.ico');
        if (ico) ico.textContent = playing ? '⏸' : '▶';
      });
    }

    var idx = activeClip ? activeClip.idx : -1;
    if (barPrevBtn) barPrevBtn.disabled = idx <= 0;
    if (barNextBtn) barNextBtn.disabled = idx < 0 || idx >= mobileClips.length - 1;
    if (fsPrevBtn)  fsPrevBtn.disabled  = idx <= 0;
    if (fsNextBtn)  fsNextBtn.disabled  = idx < 0 || idx >= mobileClips.length - 1;
  }

  function startBarTimer() {
    if (barTimer) clearInterval(barTimer);
    barTimer = setInterval(updateAllDisplays, 200);
  }
  function stopBarTimer() {
    if (barTimer) { clearInterval(barTimer); barTimer = null; }
  }

  function playClipAt(idx) {
    if (!mobileAudio) return;
    if (idx < 0 || idx >= mobileClips.length) return;
    var clip = mobileClips[idx];
    if (activeClip && activeClip.idx === idx) {
      if (mobileAudio.paused) { mobileAudio.play().catch(function () {}); }
      else { mobileAudio.pause(); }
      return;
    }
    activeClip = { clip: clip, idx: idx };
    mobileAudio.src = clip.audioPath;
    mobileAudio.play().then(function () { syncBarToActive(); }).catch(function () { activeClip = null; });
  }

  function syncBarToActive() {
    if (!activeClip) return;
    var clip = activeClip.clip;
    if (barClipName) { barClipName.textContent = clip._label || 'Playing'; barClipName.classList.remove('idle'); }
    if (fsTitle) fsTitle.textContent = clip._label || 'Playing';
    if (barPlayBtn) { barPlayBtn.textContent = '⏸'; barPlayBtn.classList.remove('idle'); }
    if (fsPlayBtn)  { fsPlayBtn.textContent = '⏸'; }
    updateAllDisplays();
  }

  function playBarClip(clip) {
    var idx = mobileClips.indexOf(clip);
    if (idx < 0) return;
    playClipAt(idx);
  }

  function stopBarAudio() {
    if (!mobileAudio) return;
    mobileAudio.pause();
    mobileAudio.currentTime = 0;
    stopBarTimer();
    activeClip = null;
    if (barPlayBtn)  { barPlayBtn.textContent = '▶'; barPlayBtn.classList.add('idle'); }
    if (barClipName) { barClipName.textContent = 'Tap to browse · double-tap to zoom'; barClipName.classList.add('idle'); }
    if (barCountdown) barCountdown.textContent = '';
    setBarProgress(0);
    updateFsScrubber(0);
    if (fsElapsed)   fsElapsed.textContent   = '0:00';
    if (fsRemaining) fsRemaining.textContent = '';
    if (fsPlayBtn)   fsPlayBtn.textContent   = '▶';
    if (fsTitle)     fsTitle.textContent     = 'Choose a clip below';
    updateAllDisplays();
  }

  function openSheet() {
    if (!bottomBar || !barSheet) return;
    sheetOpen = true;
    bottomBar.classList.add('sheet-open');
    if (barExpandBtn) barExpandBtn.textContent = '▼';
  }
  function closeSheet() {
    if (!bottomBar) return;
    sheetOpen = false;
    bottomBar.classList.remove('sheet-open');
    if (barExpandBtn) barExpandBtn.textContent = '▲';
  }

  function openFullScreen() {
    if (!fsOverlay) return;
    fsOpen = true;
    fsOverlay.classList.add('open');
    document.body.classList.add('chiron-fs-lock');
    if (activeClip) { if (fsTitle) fsTitle.textContent = activeClip.clip._label || 'Playing'; }
    else { if (fsTitle) fsTitle.textContent = 'Choose a clip below'; }
    updateAllDisplays();
  }
  function closeFullScreen() {
    fsOpen = false;
    if (fsOverlay) fsOverlay.classList.remove('open');
    document.body.classList.remove('chiron-fs-lock');
  }

  function buildOrderedClips(rawClips) {
    var whole = rawClips.filter(function (c) { return c.artifact === 'summary' || c.artifact === 'shortened'; });
    var sects = rawClips.filter(function (c) { return c.artifact === 'section'; });
    return whole.concat(sects);
  }

  function labelClips(clips) {
    clips.forEach(function (c) {
      if (c.artifact === 'summary')   { c._label = 'Summary'; return; }
      if (c.artifact === 'shortened') { c._label = 'Full lecture'; return; }
      if (c.sectionId) {
        var el = document.getElementById(c.sectionId);
        var h = el && el.querySelector('h1,h2,h3,[data-section-title]');
        c._label = h && h.textContent.trim()
          ? h.textContent.trim().replace(/^\s*\d+[\.\)]?\s*/, '')
          : (c.sectionId || 'Section');
        return;
      }
      c._label = 'Clip';
    });
  }

  function buildClipRows(container, clips, onPick) {
    container.innerHTML = '';
    clips.forEach(function (c, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chiron-bar-clip-btn';
      btn.setAttribute('data-clip-idx', i);
      var ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = '▶';
      var lbl = document.createElement('span'); lbl.textContent = c._label || c.sectionId || 'Clip';
      btn.appendChild(ico); btn.appendChild(lbl);
      btn.addEventListener('click', function () { onPick(c, i); });
      container.appendChild(btn);
    });
  }

  function seekAudioTo(fraction) {
    if (!mobileAudio || !activeClip) return;
    var dur = mobileAudio.duration;
    if (!isFinite(dur) || dur <= 0) return;
    mobileAudio.currentTime = Math.max(0, Math.min(1, fraction)) * dur;
    updateAllDisplays();
  }

  function wireSeekOn(el, fractionFn) {
    var dragging = false;
    el.addEventListener('pointerdown', function (e) {
      if (!activeClip) return;
      dragging = true;
      el.setPointerCapture(e.pointerId);
      seekAudioTo(fractionFn(e, el));
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      seekAudioTo(fractionFn(e, el));
      e.preventDefault();
    });
    function onUp(e) {
      if (!dragging) return;
      dragging = false;
      seekAudioTo(fractionFn(e, el));
      el.releasePointerCapture(e.pointerId);
    }
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', function () { dragging = false; });
  }

  function fractionFromHoriz(e, el) {
    var rect = el.getBoundingClientRect();
    if (rect.width <= 0) return 0;
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  }

        _tapTimer = setTimeout(function () {
          _tapTimer = null;
          sheetOpen ? closeSheet() : openSheet();
        }, 280);
      }
    });

    document.addEventListener('click', function (e) {
      if (!sheetOpen || !bottomBar) return;
      if (!bottomBar.contains(e.target)) closeSheet();
    });

    mobileAudio.addEventListener('ended', function () {
      stopBarTimer();
      if (activeClip && activeClip.idx < mobileClips.length - 1) {
        var nextIdx = activeClip.idx + 1;
        activeClip = null;
        playClipAt(nextIdx);
        var nextClip = mobileClips[nextIdx];
        if (nextClip && nextClip.sectionId) {
          var el = document.getElementById(nextClip.sectionId);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } else {
        stopBarAudio();
        if (barClipName) barClipName.textContent = 'Finished — tap to replay';
      }
    });

    mobileAudio.addEventListener('pause', function () {
      stopBarTimer();
      if (barPlayBtn) barPlayBtn.textContent = '▶';
      if (fsPlayBtn)  fsPlayBtn.textContent  = '▶';
      updateAllDisplays();
    });

    mobileAudio.addEventListener('play', function () {
      if (barPlayBtn) { barPlayBtn.textContent = '⏸'; barPlayBtn.classList.remove('idle'); }
      if (fsPlayBtn)  fsPlayBtn.textContent  = '⏸';
      startBarTimer();
      syncBarToActive();
    });

    buildFsOverlay();
  }

  function loadClips(rawClips) {
    var ordered = buildOrderedClips(rawClips);
    labelClips(ordered);
    mobileClips = ordered;
    if (barSheet) {
      var titleNode = barSheet.querySelector('.chiron-bar-sheet-title');
      barSheet.innerHTML = '';
      if (titleNode) barSheet.appendChild(titleNode);
      buildClipRows(barSheet, ordered, function (c) { playBarClip(c); closeSheet(); });
    }
    populateFsClipList();
    updateAllDisplays();
  }

  function initMobile() {
    injectHamburger();
    injectBottomBar();
    if (window.__chironAudioManifest) {
      var ready = (window.__chironAudioManifest.clips || []).filter(function (c) { return c.status === 'done' && c.audioPath; });
      if (ready.length) loadClips(ready);
      return;
    }
    fetch('audio/manifest.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) {
        if (!m || !m.clips) return;
        var ready = m.clips.filter(function (c) { return c.status === 'done' && c.audioPath; });
        if (ready.length) loadClips(ready);
      })
      .catch(function () {});
  }

  function onMqlChange(mq) {
    if (mq.matches) {
      if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initMobile); }
      else { initMobile(); }
    } else {
      if (hamburger) hamburger.style.display = 'none';
      if (backdrop)  backdrop.style.display  = 'none';
      if (bottomBar) bottomBar.style.display = 'none';
      if (fsOverlay) { fsOverlay.classList.remove('open'); }
      if (sidebar) {
        sidebar.classList.remove('drawer-open');
        sidebar.style.removeProperty('display');
      }
      document.body.classList.remove('drawer-scroll-lock', 'chiron-fs-lock');
      drawerOpen_ = false;
    }
  }

  if (MQL) {
    if (MQL.addEventListener) MQL.addEventListener('change', onMqlChange);
    else if (MQL.addListener) MQL.addListener(onMqlChange);
    onMqlChange(MQL);
  }
})();
  </script>

</body>
</html>
