<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chiron Library</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a5f">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chiron">
<script>try{var _t=localStorage.getItem('chiron.theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<style>
:root{
  --chiron-bg:#faf8f5;--chiron-surface:#fff;--chiron-elevated:#f0ebe4;
  --chiron-fg:#1a1a1a;--chiron-fg-secondary:#4a4a4a;--chiron-muted:#7a7a7a;
  --chiron-accent:#1e3a5f;--chiron-border:#e5e0d8;--chiron-divider:#ede8df;
  --r-md:8px;--r-lg:12px;--sh-sm:0 1px 2px rgba(0,0,0,.05);--sh-md:0 4px 6px rgba(0,0,0,.07);
  --med:#1e6fbf;--medbg:#eef4fb;--medit:#b3522e;--meditbg:#f3e9d8;--lang:#6b8e4e;--langbg:#eef3e6;--code:#6d28d9;--codebg:#efeafe;
  --t-RISING:#15803d;--t-PERENNIAL:#1e6fbf;--t-FADING:#9a7b3f;--t-EMERGING:#7c3aed;
  --font-h:'Inter',system-ui,sans-serif;--font-b:'Source Sans 3','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-b);background:var(--chiron-bg);color:var(--chiron-fg);display:flex;flex-direction:column}
.topbar{flex:0 0 auto;height:58px;background:var(--chiron-surface);border-bottom:1px solid var(--chiron-border);display:flex;align-items:center;gap:14px;padding:0 18px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-h);font-weight:800;color:var(--chiron-accent);font-size:16px}
.brand .mk{width:28px;height:28px;border-radius:8px;background:var(--chiron-accent);color:#fff;display:grid;place-items:center;font-size:14px}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--chiron-border);border-radius:99px;padding:0 16px 0 38px;font:inherit;font-size:14px;background:var(--chiron-bg);color:var(--chiron-fg)}
.search input:focus{outline:none;border-color:var(--chiron-accent);box-shadow:0 0 0 3px rgba(30,111,191,.12)}
.search .mag{position:absolute;left:14px;top:11px;color:var(--chiron-muted)}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--chiron-muted)}
.sort select{font:inherit;font-size:13px;border:1px solid var(--chiron-border);border-radius:99px;padding:6px 12px;background:var(--chiron-surface);color:var(--chiron-fg);cursor:pointer}
.pills{flex:0 0 auto;background:var(--chiron-surface);border-bottom:1px solid var(--chiron-border);padding:9px 18px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pgl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--chiron-muted);margin-right:4px}
.pill{font:inherit;font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--chiron-border);background:var(--chiron-bg);color:var(--chiron-fg-secondary);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--chiron-accent)}.pill.on{background:var(--chiron-accent);color:#fff;border-color:var(--chiron-accent)}
.pill .ct{opacity:.6;font-size:11px}
.pill.dom-medicine.on{background:var(--med);border-color:var(--med)}.pill.dom-medical-italian.on{background:var(--medit);border-color:var(--medit)}.pill.dom-italian.on{background:var(--lang);border-color:var(--lang)}.pill.dom-code.on{background:var(--code);border-color:var(--code)}
.sep{width:1px;height:18px;background:var(--chiron-border);margin:0 4px}
.body{flex:1;display:flex;min-height:0}
.facets{flex:0 0 236px;border-right:1px solid var(--chiron-border);background:var(--chiron-surface);overflow:auto;padding:6px 0}
.facets h4{font-family:var(--font-h);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--chiron-muted);margin:14px 16px 6px}
.frow{display:flex;align-items:center;gap:8px;padding:5px 16px;font-size:13px;color:var(--chiron-fg-secondary);cursor:pointer}
.frow:hover{background:var(--chiron-elevated)}.frow.on{color:var(--chiron-accent);font-weight:600}
.frow.sub{padding-left:28px;font-size:12.5px}
.frow .fct{margin-left:auto;font-size:11px;color:var(--chiron-muted);background:var(--chiron-elevated);border-radius:99px;padding:1px 7px}
.fhint{font-size:11.5px;color:var(--chiron-muted);font-style:italic;padding:2px 16px 6px}
.results{flex:1;overflow:auto}
.rhead{position:sticky;top:0;background:var(--chiron-bg);padding:12px 18px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--chiron-divider);z-index:2}
.rcount{font-family:var(--font-h);font-size:13px;color:var(--chiron-fg-secondary);font-weight:600}
.crumb{font-size:12px;color:var(--chiron-muted)}.crumb b{color:var(--chiron-accent)}
.clr{font-size:12px;color:var(--chiron-accent);cursor:pointer;margin-left:auto}
.row{display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--chiron-divider);cursor:pointer;text-decoration:none;color:inherit}
.row:hover{background:var(--chiron-surface)}
.row.bank{background:rgba(200,163,63,.06)}
.row.bank:hover{background:rgba(200,163,63,.11)}
.bank{font-size:10px;font-weight:700;color:#8a6d1e;background:#f6edd0;border:1px solid #e6d9ad;border-radius:99px;padding:0 7px;letter-spacing:.02em;white-space:nowrap}
.scope.sysscope{color:var(--chiron-accent);border-color:#c7d4e4;background:#eef3f9;font-weight:700}
.row.sys-overview{/* system overviews read via the bold title below — no accent edge */}
.row.sys-overview .rtitle{font-weight:800}
.dbadge{flex:0 0 auto;width:8px;height:40px;border-radius:3px}
.dbadge.medicine{background:var(--med)}.dbadge.medical-italian{background:var(--medit)}.dbadge.italian{background:var(--lang)}.dbadge.code{background:var(--code)}
.rinfo{min-width:0;flex:1}
.rtitle{font-family:var(--font-h);font-size:14px;color:var(--chiron-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:11.5px;color:var(--chiron-muted);display:flex;gap:7px;align-items:center;margin-top:2px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:1px 8px;border-radius:99px;background:var(--chiron-elevated);color:var(--chiron-fg-secondary)}
.tag.sys{background:var(--medbg);color:var(--med)}.tag.subj{background:#e7eef9;color:#1b4f86;font-weight:600}.tag.topic{background:var(--langbg);color:var(--lang)}
.tag.dom-medicine{background:var(--medbg);color:var(--med)}.tag.dom-medical-italian{background:var(--meditbg);color:var(--medit)}.tag.dom-italian{background:var(--langbg);color:var(--lang)}.tag.dom-code{background:var(--codebg);color:var(--code)}
.scope{font-size:10px;border:1px solid var(--chiron-border);border-radius:99px;padding:0 7px;color:var(--chiron-muted)}
.trend{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.trend.RISING{color:var(--t-RISING)}.trend.PERENNIAL{color:var(--t-PERENNIAL)}.trend.FADING{color:var(--t-FADING)}.trend.EMERGING{color:var(--t-EMERGING)}
.backsrc{font-size:10.5px;padding:1px 8px;border-radius:99px;background:var(--chiron-elevated);color:var(--chiron-fg-secondary);text-decoration:none;white-space:nowrap}
.backsrc:hover{color:var(--chiron-fg);text-decoration:underline}
.rstatus{flex:0 0 auto;font-size:11px;display:flex;align-items:center;gap:8px}
.ready{color:var(--t-RISING)}.queued{color:var(--chiron-muted)}
.open{font-size:11px;font-weight:600;color:var(--chiron-accent);border:1px solid var(--chiron-border);border-radius:99px;padding:3px 11px}
.gen{font-size:11px;border:1px dashed var(--chiron-border);border-radius:99px;padding:3px 10px;color:var(--chiron-muted)}
.gen.on{border-style:solid;border-color:var(--chiron-accent);color:var(--chiron-accent);cursor:pointer}
.gen.on:hover{background:var(--chiron-accent);color:#fff}
.empty{padding:40px;text-align:center;color:var(--chiron-muted)}
.sechdr{display:flex;align-items:center;gap:8px;padding:16px 18px 7px;font-family:var(--font-h);font-weight:700;font-size:13px;color:var(--chiron-fg-secondary);border-bottom:1px solid var(--chiron-divider)}
.secct{font-weight:600;font-size:12px;color:#fff;background:var(--chiron-accent);border-radius:99px;padding:0 8px}
.secnote{font-weight:400;font-size:12px;color:var(--chiron-muted);margin-left:auto}
.reviewband{padding:11px 14px;margin:8px 14px 4px;background:#fef9c3;border:1px solid #eab308;border-radius:10px;color:#713f12;font-weight:600;font-size:13px}
:root[data-theme=dark] .reviewband{background:#3a3312;color:#eab308}
/* ---------- W1 hide-toggle rail ---------- */
.hgrp{display:flex;align-items:center;font-family:var(--font-h);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--chiron-muted);margin:14px 14px 5px}
.hgrp .unhide{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--chiron-accent);cursor:pointer}
.hgrp .unhide:hover{text-decoration:underline}.hgrp .unhide.dim{opacity:.35;cursor:default;pointer-events:none}
.hrow{display:flex;align-items:center;gap:9px;padding:5px 14px;font-size:13px;color:var(--chiron-fg-secondary);cursor:pointer;user-select:none}
.hrow:hover{background:var(--chiron-elevated)}
.hrow .box{width:16px;height:16px;border-radius:5px;border:1.6px solid var(--chiron-muted);flex:0 0 auto;display:grid;place-items:center;transition:.12s}
.hrow .box svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.hrow.m .box{border-color:var(--med)}.hrow.mi .box{border-color:var(--medit)}.hrow.l .box{border-color:var(--lang)}
.hrow.m.vis .box{background:var(--med)}.hrow.mi.vis .box{background:var(--medit)}.hrow.l.vis .box{background:var(--lang)}
.hrow.vis .box svg{opacity:1}
.hrow .hn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hc{margin-left:auto;font-size:11px;color:var(--chiron-muted);background:var(--chiron-elevated);border-radius:99px;padding:1px 7px}
.hrow.off{opacity:.4}.hrow.off .hn{text-decoration:line-through;text-decoration-color:var(--chiron-muted)}
.hidechips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 4px}
.hchip{font-size:11px;color:var(--chiron-fg-secondary);background:var(--chiron-elevated);border:1px solid var(--chiron-border);border-radius:99px;padding:2px 6px 2px 10px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.hchip b{font-size:12px;color:var(--chiron-muted)}.hchip:hover{border-color:var(--chiron-accent)}
/* ---------- tile wall ---------- */
.twall{padding:14px 18px 40px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.tcard{background:var(--chiron-surface);border:1px solid var(--chiron-border);border-radius:13px;overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .1s,box-shadow .1s;display:flex;flex-direction:column}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.tcard.queued{opacity:.82;cursor:default}.tcard.queued:hover{transform:none}
.tcard.bankq{box-shadow:var(--sh-sm)}  /* bankable shown by its ★ badge, not an edge */
/* domain color is carried by the .db badge pill below — no colored card-edge strip (removed) */
.tcard .tb{padding:11px 13px 0;flex:1}
.tcard .tt{font-family:var(--font-h);font-weight:700;font-size:13.5px;line-height:1.28;color:var(--chiron-fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .ts{font-size:10.5px;color:var(--chiron-muted);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .tbadges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tcard .tbadges .tag{font-size:9.5px}
.tcard .tf{display:flex;align-items:center;gap:7px;padding:10px 13px 12px;margin-top:6px}
.tcard .db{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:99px}
/* option C — soft domain tint fills the card (no edge); solid domain pill in the footer */
.tcard.medicine{background:var(--medbg)}.tcard.medical-italian{background:var(--meditbg)}.tcard.italian{background:var(--langbg)}.tcard.code{background:var(--codebg)}
.tcard.medicine .db{background:var(--med);color:#fff}.tcard.medical-italian .db{background:var(--medit);color:#fff}.tcard.italian .db{background:var(--lang);color:#fff}.tcard.code .db{background:var(--code);color:#fff}
.tcard .tclips{font-size:10px;color:var(--chiron-muted)}
.tcard .taction{margin-left:auto;font-size:10.5px;font-weight:700;border-radius:99px;padding:4px 11px;white-space:nowrap}
.tcard .taction.open{color:var(--chiron-accent);border:1px solid var(--chiron-border)}
.tcard .taction.open:hover{background:var(--chiron-accent);color:#fff}
.tcard .taction.gen{color:var(--chiron-accent);border:1px solid var(--chiron-accent);cursor:pointer}
.tcard .taction.gen:hover{background:var(--chiron-accent);color:#fff}
.tcard .taction.dl{color:var(--t-RISING);border:1px solid var(--t-RISING)}
.tcard .taction.acc{color:#fff;background:var(--t-RISING);border:1px solid var(--t-RISING);cursor:pointer}
.tcard .taction.acc:hover{filter:brightness(1.1)}
.tcard .treview{font-size:9px;font-weight:800;color:#713f12;background:#fde68a;border-radius:99px;padding:2px 7px;letter-spacing:.02em}
:root[data-theme=dark] .tcard .treview{background:#3a3312;color:#eab308}
.tcard .tbank{font-size:9px;font-weight:700;color:#8a6d1e;background:#f6edd0;border:1px solid #e6d9ad;border-radius:99px;padding:1px 6px}
/* ---------- MOBILE (M-A: tab bar + filter sheet) ---------- */
.mbar{display:none}
.sheet-backdrop{display:none}
.sheet-apply{display:none}
@media (max-width:760px){
  .topbar{height:52px;gap:8px;padding:0 12px}
  .brand .lbl{display:none}
  .sort{margin-left:0}.sort .sl{display:none}
  .sort select{padding:6px 8px;max-width:120px}
  .pills{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pills::-webkit-scrollbar{display:none}
  .pills .pgl{display:none}.pills .sep{display:none}
  .facets{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:80vh;
    border-right:none;border-top:1px solid var(--chiron-border);border-radius:18px 18px 0 0;
    transform:translateY(105%);transition:transform .26s ease;z-index:60;box-shadow:0 -10px 30px rgba(0,0,0,.2);padding-bottom:64px}
  .facets.open{transform:translateY(0)}
  .facets::before{content:"";display:block;width:40px;height:4px;border-radius:99px;background:var(--chiron-border);margin:9px auto 2px}
  .sheet-apply{display:block;position:sticky;bottom:0;background:var(--chiron-surface);border-top:1px solid var(--chiron-border);padding:10px 14px}
  .sheet-apply button{width:100%;height:44px;border:none;border-radius:99px;background:var(--chiron-accent);color:#fff;font:inherit;font-weight:700;font-size:15px}
  .sheet-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .results{padding-bottom:66px}
  .rhead .crumb{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--chiron-surface);border-top:1px solid var(--chiron-border);z-index:50}
  .mbar button{flex:1;border:none;background:none;font:inherit;font-size:10px;color:var(--chiron-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .mbar button .ic{font-size:18px}
  .mbar button.on{color:var(--chiron-accent)}
}
/* ---------- dark theme (single toggle: 🌙/☀️) ---------- */
:root[data-theme=dark]{
  --chiron-bg:#0f0f1a;--chiron-surface:#1a1a2e;--chiron-elevated:#252540;
  --chiron-fg:#f1f5f9;--chiron-fg-secondary:#cbd5e1;--chiron-muted:#64748b;
  --chiron-accent:#8b5cf6;--chiron-border:#2e2e4a;--chiron-divider:#1f1f35;
  --med:#38bdf8;--medbg:#12263a;--medit:#f59e0b;--meditbg:#332510;--lang:#86efac;--langbg:#15301e;--code:#a78bfa;--codebg:#241a3a;
  --t-RISING:#22c55e;--sh-sm:0 1px 2px rgba(0,0,0,.3);--sh-md:0 4px 8px rgba(0,0,0,.45);
}
body,.topbar,.pills,.facets,.row,.rhead{transition:background .2s,color .2s,border-color .2s}
/* topbar actions */
.genbtn{font:inherit;font-weight:700;font-size:13px;font-family:var(--font-h);border:none;border-radius:99px;background:var(--chiron-accent);color:#fff;padding:8px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.genbtn:hover{filter:brightness(1.1)}
.themebtn{border:1px solid var(--chiron-border);background:var(--chiron-surface);color:var(--chiron-fg);border-radius:99px;width:36px;height:36px;font-size:15px;cursor:pointer;flex:0 0 auto}
.themebtn:hover{border-color:var(--chiron-accent)}
/* staging row actions */
.accept{font-size:11px;font-weight:700;color:#fff;background:var(--t-RISING);border:none;border-radius:99px;padding:4px 12px;cursor:pointer}
.accept:hover{filter:brightness(1.1)}
.sendback{font-size:11px;font-weight:600;color:var(--t-FADING);border:1px solid var(--chiron-border);border-radius:99px;padding:3px 11px;cursor:pointer;background:none}
.sendback:hover{border-color:var(--t-FADING)}
/* modal + wizard */
.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-start;justify-content:center;padding:38px 16px;overflow:auto}
.modal-back.show{display:flex}
.modal{background:var(--chiron-surface);border:1px solid var(--chiron-border);border-radius:16px;box-shadow:var(--sh-md);width:100%;max-width:520px}
.modal-h{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--chiron-divider);font-family:var(--font-h);font-size:16px;color:var(--chiron-fg)}
.modal-h b{flex:1}
.modal-h .x{border:none;background:none;font-size:18px;color:var(--chiron-muted);cursor:pointer}
.modal-b{padding:16px 18px}
.fl{display:block;font-family:var(--font-h);font-size:12px;font-weight:600;color:var(--chiron-fg-secondary);margin:13px 0 5px}
.fl:first-child{margin-top:0}
.opt{font-weight:400;color:var(--chiron-muted)}
.fi{width:100%;border:1px solid var(--chiron-border);border-radius:9px;background:var(--chiron-bg);color:var(--chiron-fg);font:inherit;font-size:14px;padding:9px 11px}
.fi:focus{outline:none;border-color:var(--chiron-accent);box-shadow:0 0 0 3px rgba(139,92,246,.14)}
.frow2{display:flex;gap:12px}.frow2>div{flex:1;min-width:0}
.hint{font-size:12px;color:var(--chiron-muted);margin-top:7px;min-height:16px}
.hint b{color:var(--chiron-accent);text-transform:capitalize}
.imglist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.capture{display:flex;align-items:center;gap:8px}
.capbtn{font:inherit;font-size:13px;font-family:var(--font-h);border:1px solid var(--chiron-border);background:var(--chiron-bg);color:var(--chiron-fg);border-radius:9px;padding:8px 13px;cursor:pointer}
.capbtn:hover{border-color:var(--chiron-accent)}
.imgcount{font-size:12px;color:var(--chiron-muted)}
.imglist .thumb{position:relative;display:inline-block}
.imglist .thumb img{width:50px;height:50px;object-fit:cover;border-radius:7px;border:1px solid var(--chiron-border);display:block}
.imglist .thumb button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:none;background:var(--chiron-fg);color:var(--chiron-bg);font-size:12px;line-height:16px;cursor:pointer;padding:0}
.modal-f{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--chiron-divider)}
.chk{font-size:12px;color:var(--chiron-muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.btn-gen{margin-left:auto;font:inherit;font-family:var(--font-h);font-weight:700;font-size:14px;border:none;border-radius:99px;background:var(--chiron-accent);color:#fff;padding:10px 20px;cursor:pointer}
.btn-gen:disabled{opacity:.5;cursor:default}
.btn-sec{font:inherit;font-family:var(--font-h);font-weight:600;font-size:13px;border:1px solid var(--chiron-border);border-radius:99px;background:var(--chiron-surface);color:var(--chiron-fg);padding:8px 15px;cursor:pointer}
.btn-sec:first-child{margin-left:auto}
/* live progress */
.progtitle{font-family:var(--font-h);font-size:15px;font-weight:700;margin-bottom:14px;color:var(--chiron-fg)}
.steps{display:flex;flex-direction:column;gap:9px}
.step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--chiron-muted)}
.step .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--chiron-border);flex:0 0 auto;display:grid;place-items:center;font-size:10px}
.step.done{color:var(--chiron-fg)}.step.done .dot{background:var(--t-RISING);border-color:var(--t-RISING);color:#fff}
.step.active{color:var(--chiron-fg);font-weight:600}.step.active .dot{border-color:var(--chiron-accent);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(139,92,246,.22)}}
.plog{background:var(--chiron-bg);border:1px solid var(--chiron-divider);border-radius:8px;padding:9px;font-size:11px;color:var(--chiron-muted);max-height:120px;overflow:auto;margin-top:14px;white-space:pre-wrap;font-family:ui-monospace,monospace}

<style>
 .jobsdot{width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;margin-left:5px;animation:jp 1s infinite;vertical-align:middle}
 #jobslist .jhead{font:700 11px system-ui;letter-spacing:.04em;text-transform:uppercase;color:#64748b;margin:16px 0 6px}
 #jobslist .jhead:first-child{margin-top:2px}
 #jobslist .jhead-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
 #jobslist .jbakeall{background:#fdead0;color:#b5641a;border:0;border-radius:8px;padding:5px 11px;font:800 11px system-ui;cursor:pointer;white-space:nowrap;text-transform:none;letter-spacing:0}
 #jobslist .jbakeall:hover{background:#fbd9a8}
 #jobslist .jrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid rgba(148,163,184,.2)}
 #jobslist .jdot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex:none}
 #jobslist .jrow.gen .jdot{background:#f59e0b;animation:jp 1s infinite}
 #jobslist .jrow.ready .jdot{background:#10b981}

 @keyframes jp{50%{opacity:.3}}
 #jobslist .jmeta{flex:1;min-width:0;display:flex;flex-direction:column}
 #jobslist .jmeta b{font:600 13px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #jobslist .jsub{font:500 11px ui-monospace,monospace;color:#94a3b8}
 #jobslist .jopen,#jobslist .jretry{border:0;border-radius:8px;padding:5px 11px;font:700 11px system-ui;cursor:pointer;white-space:nowrap}
 #jobslist .jopen{background:#14b8a6;color:#04211d}
 #jobslist .jretry{background:#fee2e2;color:#b91c1c}
 #jobslist .jaccept{background:#dff3e6;color:#1f7a44;border:0;border-radius:8px;padding:5px 11px;font:700 11px system-ui;cursor:pointer;white-space:nowrap}
 #jobslist .jrebake{background:#fdead0;color:#b5641a;border:0;border-radius:8px;padding:5px 11px;font:700 11px system-ui;cursor:pointer;white-space:nowrap}

 .jdepth{font:700 8.5px ui-monospace,monospace;padding:1px 6px;border-radius:5px;background:var(--chiron-elevated);color:var(--chiron-fg-secondary);margin-left:6px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
 .jdepth.medicine{background:#eef4fb;color:#1e6fbf}.jdepth.medical-italian{background:#f3e9d8;color:#b3522e}.jdepth.italian{background:#eef3e6;color:#6b8e4e}
 #jobslist .jdismiss{background:transparent;border:0;color:var(--chiron-muted);cursor:pointer;font-size:15px;line-height:1;padding:3px 6px;border-radius:6px}
 #jobslist .jdismiss:hover{background:#fde2e2;color:#b91c1c}
 #jobslist .jexp{background:var(--chiron-elevated);color:var(--chiron-muted);border:0;border-radius:8px;padding:5px 9px;font:700 10.5px system-ui;cursor:pointer}
 #jobslist .jcancel{background:#fee2e2;color:#b91c1c;border:0;border-radius:8px;padding:5px 11px;font:700 11px system-ui;cursor:pointer;white-space:nowrap}
 #jobslist .jcancel:hover{background:#fecaca}
 /* status pills — distinguish "just needs rebaking" (text ok, audio missing) from a real failure */
 .jpill{font:700 9px system-ui;padding:2px 7px;border-radius:99px;white-space:nowrap;margin-left:4px}
 .jpill.rebake{background:#fdead0;color:#b5641a}   /* 🔥 needs rebaking */
 .jpill.viewable{background:#e6f0fb;color:#1e6fbf} /* 📖 readable, audio pending */
 .jpill.fail{background:#fde2e2;color:#b91c1c}     /* real failure */
 /* timeline rail (per-lesson generation observability) */
 #jobslist .rail{margin:2px 0 10px 6px}
 .tlrail{position:relative;padding-left:20px}
 .tlrail:before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--chiron-divider)}
 .tln{position:relative;padding:4px 0}
 .tldot{position:absolute;left:-17px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--chiron-surface);border:2px solid #b9b2a6}
 .tln.running .tldot{border-color:#c8781f;box-shadow:0 0 0 3px rgba(200,120,31,.16);animation:jp 1.1s infinite}
 .tln.done .tldot{border-color:#2e8b57;background:#2e8b57} .tln.error .tldot{border-color:#ef4444;background:#ef4444}
 .tlnm{font:600 12px system-ui} .tln.done .tlnm{color:var(--chiron-fg-secondary)}
 .tlm{font:500 10px ui-monospace,monospace;color:var(--chiron-muted)}
 .tlsubs{margin:4px 0 2px;padding:6px 9px;border-left:2px solid var(--chiron-divider);background:var(--chiron-bg);border-radius:0 7px 7px 0}
 .tls{display:flex;gap:6px;align-items:center;font:500 11px system-ui;color:var(--chiron-fg-secondary);padding:1px 0}
 .tls.err{color:#b3522e} .tchip{font:700 8.5px ui-monospace,monospace;padding:1px 5px;border-radius:4px;background:var(--chiron-elevated)}
 .tchip.mod{background:#eef4fb;color:#1e6fbf}.tchip.tool{background:#eef3e6;color:#6b8e4e}
 .tok{font-family:ui-monospace,monospace;color:#1e6fbf} .rail-empty{font-size:11px;color:var(--chiron-muted);padding:4px 0 8px}
 .tspin{display:inline-block;width:9px;height:9px;border:2px solid #c8781f;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
 @keyframes sp{to{transform:rotate(360deg)}}
 /* raw event modal */
 #rawback{position:fixed;inset:0;background:rgba(18,16,13,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:2147483000}

 /* ---- Captures browser ---- */
 @media(min-width:900px){ #capback .cap-modal{max-width:min(720px,92vw)} }
 .cap-modal{display:flex;flex-direction:column;max-height:86vh}
 .cap-modal .modal-h b{flex:0 0 auto}
 .cap-summary{font:600 12px system-ui;color:var(--chiron-muted);margin-left:10px;flex:1}
 .cap-body{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0;padding:12px 16px}
 .cap-controls{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex:0 0 auto}

 .cap-row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:9px;border:1px solid var(--chiron-border);background:var(--chiron-surface);cursor:default}

 .cap-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
 .cap-kind{font:700 9.5px system-ui;text-transform:uppercase;letter-spacing:.03em;padding:1px 8px;border-radius:99px;background:var(--chiron-elevated);color:var(--chiron-fg-secondary);flex:0 0 auto}
 .cap-kind.answer{background:var(--medbg);color:var(--med)}.cap-kind.term{background:var(--langbg);color:var(--lang)}.cap-kind.note{background:var(--codebg);color:var(--code)}
 .cap-text{font:600 13.5px system-ui;color:var(--chiron-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
 .cap-done{color:var(--t-RISING);font-weight:700;margin-left:auto}
 .cap-meta{font:500 11px system-ui;color:var(--chiron-muted);margin-top:3px}
